# Push-to-deploy: every push to main SSHes into the VPS and runs ./deploy.sh
# there — the same script, the same checks, just fired by GitHub instead of a
# hand. The script itself pulls, builds, ships, restarts and verifies /health,
# so this workflow is nothing but the ssh call.
#
# Setup (repository → Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY      private key whose public half is in the VPS user's
#                       ~/.ssh/authorized_keys (make a dedicated keypair:
#                       ssh-keygen -t ed25519 -f deploy_key -N "")
#   DEPLOY_HOST         the VPS hostname or IP
#   DEPLOY_USER         the unix user owning /srv/kosmos
#   DEPLOY_PORT         optional, default 22
#   DEPLOY_DIR          optional, default /srv/kosmos
#   DEPLOY_KNOWN_HOSTS  optional but recommended: output of
#                       ssh-keyscan <host>; without it the first connection
#                       trusts-on-first-use (accept-new)
#
# Until the secrets exist the job exits green with a warning, so pushes are
# not painted red on an unconfigured fork.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      args:
        description: "Arguments passed to deploy.sh (e.g. --no-fetch, or seed names to run first)"
        required: false
        default: "--no-fetch"

permissions:
  contents: read

# deploy.sh must never run twice at once on the VPS; queue, don't cancel
concurrency:
  group: deploy-kosmos
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # deploy.sh pushes "Sync from Notion" commits back to main — don't loop on them
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Sync from Notion')
    env:
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.args || '--no-fetch' }}
    steps:
      - name: Run deploy.sh on the VPS
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "::warning::Deploy skipped — set the DEPLOY_SSH_KEY, DEPLOY_HOST and DEPLOY_USER repository secrets (see the header of .github/workflows/deploy.yml)."
            exit 0
          fi
          # forgive common paste extras in the secrets: whitespace/newlines, quotes and backticks,
          # a "user@" prefix in the host, an "@host" suffix in the user, or host/user swapped
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          SSH_HOST="${SSH_HOST//\"/}"; SSH_HOST="${SSH_HOST//\'/}"; SSH_HOST="${SSH_HOST//\`/}"; SSH_HOST="${SSH_HOST##*@}"
          SSH_USER="$(printf '%s' "$SSH_USER" | tr -d '[:space:]')"
          SSH_USER="${SSH_USER//\"/}"; SSH_USER="${SSH_USER//\'/}"; SSH_USER="${SSH_USER//\`/}"; SSH_USER="${SSH_USER%%@*}"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')"
          ipv4='^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ "$SSH_USER" =~ $ipv4 && ! "$SSH_HOST" =~ $ipv4 ]]; then
            echo "::warning::DEPLOY_USER looks like an IP and DEPLOY_HOST does not — using them swapped for this run. Please fix the two secrets."
            t="$SSH_HOST"; SSH_HOST="$SSH_USER"; SSH_USER="$t"
          fi
          if ! [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::DEPLOY_HOST is not a plain hostname or IP even after cleanup (length ${#SSH_HOST}). Edit the secret so it contains exactly the server IP — e.g. 5.78.43.168 — nothing else."
            exit 1
          fi
          # accept a base64-wrapped key — the paste-proof way to store it:  base64 -w0 <keyfile>  → one clean line
          if [[ "$SSH_KEY" != *"PRIVATE KEY"* ]]; then
            dec="$(printf '%s' "$SSH_KEY" | tr -d '[:space:]' | base64 -d 2>/dev/null || true)"
            if [[ "$dec" == *"PRIVATE KEY"* ]]; then SSH_KEY="$dec"; fi
          fi
          # repair a key mangled in transit: Windows CRLF line endings, or newlines collapsed to spaces
          SSH_KEY="${SSH_KEY//$'\r'/}"
          if [ "$(printf '%s' "$SSH_KEY" | wc -l)" -lt 3 ] && [[ "$SSH_KEY" == *"-----BEGIN OPENSSH PRIVATE KEY-----"* ]]; then
            body="${SSH_KEY#*-----BEGIN OPENSSH PRIVATE KEY-----}"
            body="${body%%-----END OPENSSH PRIVATE KEY-----*}"
            body="$(printf '%s' "$body" | tr -d '[:space:]')"
            if [ -n "$body" ]; then
              SSH_KEY="$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----' "$(printf '%s' "$body" | fold -w 70)")"
              echo "::warning::DEPLOY_SSH_KEY arrived as a single line; rebuilt its line breaks for this run. Please re-save the secret with the key's original line breaks."
            fi
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            lines=$(wc -l < ~/.ssh/deploy_key)
            hasb=$([[ "$SSH_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]] && echo yes || echo no)
            hase=$([[ "$SSH_KEY" == *"END OPENSSH PRIVATE KEY"* ]] && echo yes || echo no)
            echo "::error::DEPLOY_SSH_KEY is not a valid private key (lines: $lines, BEGIN marker: $hasb, END marker: $hase — likely truncated or reflowed in the paste). Paste-proof fix: on your machine run  base64 -w0 ~/.ssh/kosmos_deploy  and save that single output line as the DEPLOY_SSH_KEY secret; the workflow decodes it."
            exit 1
          fi
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            HOSTCHECK=yes
          else
            HOSTCHECK=accept-new
          fi
          ssh -i ~/.ssh/deploy_key \
              -p "${SSH_PORT:-22}" \
              -o StrictHostKeyChecking=$HOSTCHECK \
              -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" \
              "cd '${DEPLOY_DIR:-/srv/kosmos}' && ./deploy.sh $ARGS"
