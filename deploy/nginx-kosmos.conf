# kosmos.yeahborhood.com -> node on 127.0.0.1:3002 (same pattern as musicator-domain)
server {
    listen 80;
    listen [::]:80;
    server_name kosmos.yeahborhood.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 5.78.43.168:443 ssl;
    http2 on;
    server_name kosmos.yeahborhood.com;

    ssl_certificate /etc/letsencrypt/live/kosmos.yeahborhood.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kosmos.yeahborhood.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 15m;   # photo uploads for the analyzer

    # the site's own log, so scripts/readership.py can read it apart from the other vhosts
    access_log /var/log/nginx/kosmos.access.log combined;

    # nginx.conf has gzip on for text/html only; the search index alone is 580KB of JSON
    gzip_types application/json application/xml text/plain image/svg+xml;
    gzip_vary on;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
