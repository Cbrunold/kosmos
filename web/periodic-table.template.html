<title>Kosmos · Periodic Table</title>
<style>

      --muted: #74828e;

      --cat-alkearth: #b98800;
      --cat-transition: #4a90e8;

      --cat-nonmetal: #46a850;
      --cat-noble: #8b74e0;
      --cat-lanthanide: #dc5f83;
      --cat-actinide: #a94fd0;

      --st-liquid: #5598e7;

  .dmine {

</style>

<header class="top">

  </div>
  <aside class="detail" id="detail" aria-live="polite">

<script id="data" type="application/json">__DATA__</script>
<script id="minesites" type="application/json">__MINESITES__</script>
<script id="eqdata" type="application/json">__EQUATIONS__</script>
<script id="mindata" type="application/json">__MINERALS__</script>
<script>
  const RAW = JSON.parse(document.getElementById('data').textContent);
  const EQ = JSON.parse(document.getElementById('eqdata').textContent);
  const MIN = JSON.parse(document.getElementById('mindata').textContent);

  // ---------- derivations ----------
  const CAT_DEFS = [
    { key: 'alkali',     label: 'Alkali metal',          match: null },
    { key: 'alkearth',   label: 'Alkaline earth metal',  match: '#Alkaline Earth Metal' },
    { key: 'transition', label: 'Transition metal',      match: '#Transition Metal' },
    { key: 'posttrans',  label: 'Post-transition metal', match: '#Post-Transition Metal' },
    { key: 'metalloid',  label: 'Metalloid',             match: '#Metalloid' },
    { key: 'nonmetal',   label: 'Nonmetal',              match: null },
    { key: 'noble',      label: 'Noble gas',             match: '#Noble Gas' },
    { key: 'lanthanide', label: 'Lanthanide',            match: '#Lanthanide' },
    { key: 'actinide',   label: 'Actinide',              match: '#Actinide' },
  ];
  const FAMILY_TAGS = ['#Halogens', '#Chalcogens', '#Pnictogens', '#Icosagens', '#Crystallogens', '#Coinage Metals', '#Volatile Metals'];

  const E = RAW.map((r) => {
    const z = r.atomicNumber;
    const cats = r.categories || [];
    const isF = /^f-block/.test(r.group || '');
    const lanth = z >= 57 && z <= 71;
    const actin = z >= 89 && z <= 103;
    const groupNum = isF || lanth || actin ? null : parseInt(r.group, 10) || null;
    const period = parseInt(r.period, 10) || null;

    let cat = null, catDerived = false;
    if (cats.includes('#Noble Gas')) cat = 'noble';
    else if (lanth) cat = 'lanthanide';
    else if (actin) cat = 'actinide';
    else if (cats.includes('#Transition Metal')) cat = 'transition';
    else if (cats.includes('#Post-Transition Metal')) cat = 'posttrans';
    else if (cats.includes('#Metalloid')) cat = 'metalloid';
    else if (cats.includes('#Alkaline Earth Metal')) cat = 'alkearth';
    else if (cats.some((c) => ['#Nonmetal', '#Diatomicnonmetal', '#Polyatomic nonmetal'].includes(c))) cat = 'nonmetal';
    else if (cats.includes('#Unknown Chemical Properties')) cat = null;
    else if (groupNum === 1 && z !== 1) { cat = 'alkali'; catDerived = true; }

    let block = 'f';
    if (!lanth && !actin) {
      if (groupNum === 1 || groupNum === 2 || z === 2) block = 's';
      else if (groupNum >= 13) block = 'p';
      else block = 'd';
    }

    let row, col;
    if (lanth) { row = 10; col = 3 + (z - 57); }
    else if (actin) { row = 11; col = 3 + (z - 89); }
    else { row = 1 + period; col = groupNum; }

    return { ...r, z, sym: r.notation, groupNum, periodNum: period, cat, catDerived, block, row, col,
      families: cats.filter((c) => FAMILY_TAGS.includes(c)),
      unknownProps: cats.includes('#Unknown Chemical Properties') };
  });
  const byZ = Object.fromEntries(E.map((e) => [e.z, e]));

  // ---------- helpers ----------
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const catColor = (k) => `var(--cat-${k})`;
  const fmtNum = (v, unit) => (v == null ? null : `${+v.toPrecision(6)}${unit ? ` ${unit}` : ''}`);
  const fmtYear = (y) => (y == null ? null : y < 0 ? `${-y} BCE` : String(y));
  const stateAt = (e, T) => {
    if (e.meltingPt == null || e.boilingPt == null) return null;
    if (T < e.meltingPt) return 'solid';
    if (T > e.boilingPt) return 'gas';
    return 'liquid';
  };

  // ---------- lenses ----------
  const heat = (t) => {
    const lo = +css('--heat-min'), hi = +css('--heat-max');
    const pct = lo + Math.max(0, Math.min(1, t)) * (hi - lo);
    return `color-mix(in oklab, var(--heat) ${pct.toFixed(1)}%, var(--panel))`;
  };
  const seqRange = (vals) => [Math.min(...vals), Math.max(...vals)];

  const massR = seqRange(E.map((e) => e.atomicMass).filter((v) => v != null));
  const denR = seqRange(E.map((e) => e.density).filter((v) => v != null).map(Math.log10));
  const mpR = seqRange(E.map((e) => e.meltingPt).filter((v) => v != null));
  const bpR = seqRange(E.map((e) => e.boilingPt).filter((v) => v != null));
  const lin = (v, [a, b]) => (v - a) / (b - a);

  // Crustal abundance spans 25 orders of magnitude, and the bottom decades are
  // all decay-chain traces that are "vanishingly rare" alike. Flooring at
  // 10⁻⁶ ppm keeps the precious metals distinguishable instead of crushing
  // gold, silver and copper into one shade at the top of the scale.
  const ABU_FLOOR = 1e-6;
  const abuVals = E.map((e) => e.abundance).filter((v) => v != null);
  const abuR = abuVals.length
    ? [Math.log10(ABU_FLOOR), Math.log10(Math.max(...abuVals))] : [0, 1];
  const abuRank = new Map();   // z -> 1 = rarest, among elements that occur naturally
  E.filter((e) => e.abundance != null).sort((a, b) => a.abundance - b.abundance)
    .forEach((e, i) => abuRank.set(e.z, i + 1));
  const ordinal = (n) => (n % 100 >= 11 && n % 100 <= 13 ? 'th'
    : ({ 1: 'st', 2: 'nd', 3: 'rd' })[n % 10] || 'th');
  const MINESITES = JSON.parse(document.getElementById('minesites').textContent);   // mine page id -> {name,country,type,slug}
  const fmtFactor = (f) => (f >= 100 ? Math.round(f).toLocaleString('en') : f >= 10 ? f.toFixed(0) : f.toFixed(1));
  const fmtPpm = (v) => {
    if (v == null) return null;
    if (v >= 10000) return `${(v / 10000).toFixed(v >= 100000 ? 1 : 2)}%`;
    if (v >= 1) return `${(+v.toPrecision(3)).toLocaleString('en-GB')} ppm`;
    if (v >= 1e-3) return `${+v.toPrecision(2)} ppm`;
    const exp = Math.floor(Math.log10(v));
    const mant = +(v / 10 ** exp).toPrecision(2);
    const sup = String(exp).replace('-', '⁻').replace(/\d/g, (d) => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+d]);
    return `${mant === 1 ? '' : mant + '×'}10${sup} ppm`;
  };
  const yearT = (y) => (y <= 1650 ? ((y + 9000) / 10650) * 0.25 : 0.25 + ((y - 1650) / 360) * 0.75);

  const LENSES = {
    cat: {
      name: 'Category',
      color: (e) => (e.cat ? catColor(e.cat) : null),
      value: (e) => (e.cat ? CAT_DEFS.find((c) => c.key === e.cat).label + (e.catDerived ? ' (derived)' : '') : 'unknown properties'),
      legend: () => [...CAT_DEFS.map((c) => ({ label: c.label, color: catColor(c.key) })), { label: 'unknown properties', hollow: true }],
    },
    state: {
      name: 'State',
      color: (e) => { const s = stateAt(e, temp.valueAsNumber); return s ? `var(--st-${s})` : null; },
      value: (e) => { const s = stateAt(e, temp.valueAsNumber); return s ? `${s} at ${temp.valueAsNumber} °C` : 'melting/boiling point not in Notion'; },
      legend: () => [
        { label: 'gas', color: 'var(--st-gas)' }, { label: 'liquid', color: 'var(--st-liquid)' },
        { label: 'solid', color: 'var(--st-solid)' }, { label: 'no data', hollow: true }],
      slider: 'temp',
    },
    block: {
      name: 'Block',
      color: (e) => catColor({ s: 'alkali', p: 'nonmetal', d: 'transition', f: 'noble' }[e.block]),
      value: (e) => `${e.block}-block`,
      legend: () => ['s', 'p', 'd', 'f'].map((b) => ({ label: `${b}-block`, color: catColor({ s: 'alkali', p: 'nonmetal', d: 'transition', f: 'noble' }[b]) })),
    },
    origin: {
      name: 'Origin',
      color: (e) => ({ 'Primordial': catColor('nonmetal'), 'From Decay': catColor('alkearth'), 'Synthetic': catColor('noble') }[e.occurrence] || null),
      value: (e) => e.occurrence || 'not recorded in Notion',
      legend: () => [
        { label: 'primordial', color: catColor('nonmetal') }, { label: 'from decay', color: catColor('alkearth') },
        { label: 'synthetic', color: catColor('noble') }, { label: 'not recorded', hollow: true }],
    },
    mass: { name: 'Mass', seq: true, t: (e) => (e.atomicMass == null ? null : lin(e.atomicMass, massR)),
      value: (e) => fmtNum(e.atomicMass, 'u') || 'no data', range: () => [`${massR[0]} u`, `${massR[1]} u`] },
    density: { name: 'Density', seq: true, t: (e) => (e.density == null ? null : lin(Math.log10(e.density), denR)),
      value: (e) => fmtNum(e.density, 'g/cm³') || 'no data', range: () => ['9×10⁻⁵', '22.6 g/cm³ (log scale)'] },
    melt: { name: 'Melting', seq: true, t: (e) => (e.meltingPt == null ? null : lin(e.meltingPt, mpR)),
      value: (e) => fmtNum(e.meltingPt, '°C') || 'no data', range: () => [`${mpR[0]} °C`, `${mpR[1]} °C`] },
    boil: { name: 'Boiling', seq: true, t: (e) => (e.boilingPt == null ? null : lin(e.boilingPt, bpR)),
      value: (e) => fmtNum(e.boilingPt, '°C') || 'no data', range: () => [`${bpR[0]} °C`, `${bpR[1]} °C`] },
    disc: { name: 'Discovery', seq: true, t: (e) => yearT(e.discovered),
      value: (e) => `discovered ${fmtYear(e.discovered)}`, range: () => ['9000 BCE', '2009'], slider: 'year' },
  };
  // Rarity, not abundance: the scale runs hot for the scarce ones, which is the
  // question people actually ask of a periodic table. Only offered if the data
  // is there — it arrives from Notion via scripts/seed_abundance.py.
  // Concentration factor: ore grade over crustal abundance — how much geology has to
  // enrich an element before mining it pays. Log scale from 1× to 10⁵×; hot = hard.
  const conc = (e) => (e.oreGrade != null && e.abundance ? e.oreGrade / e.abundance : null);
  if (E.some((e) => conc(e) != null)) {
    const CF_LO = 0, CF_HI = 5;   // log10
    LENSES.conc = {
      name: 'Concentration', seq: true,
      t: (e) => { const f = conc(e); return f == null ? null : Math.max(0, Math.min(1, (Math.log10(f) - CF_LO) / (CF_HI - CF_LO))); },
      value: (e) => { const f = conc(e); return f == null ? (e.minedAs === 'By-product' ? 'by-product — no ore of its own' : e.minedAs === 'Not mined' ? 'not mined' : 'no ore grade recorded') : `ore is ${fmtFactor(f)}× richer than the crust`; },
      range: () => ['1× (crust)', '≥10⁵× (log)'],
    };
  }
  if (E.some((e) => e.abundance != null)) {
    LENSES.rarity = {
      name: 'Rarity', seq: true,
      t: (e) => (e.abundance == null ? null : 1 - lin(Math.log10(Math.max(e.abundance, ABU_FLOOR)), abuR)),
      value: (e) => (e.abundance == null ? 'does not occur naturally' : `${fmtPpm(e.abundance)} of the crust${abuRank.get(e.z) ? ` · ${abuRank.get(e.z)}${ordinal(abuRank.get(e.z))} rarest of ${abuRank.size}` : ''}`),
      range: () => ['46% by mass', '≤10⁻⁶ ppm (log)'],
    };
  }
  // What the element does in a living thing (scripts/seed_biology.py). Categorical
  // rather than sequential: essentiality is a judgement about kind, not a quantity,
  // and eleven elements carrying 99.9 % of a body by mass is a fact about which
  // eleven and not about how much. Read it next to Rarity — carbon is 200 ppm of
  // the crust and about 18 % of a body, silicon is the crust's second element and
  // only ultratrace in life.
  if (E.some((e) => e.bioClass)) {
    const BIO = { Bulk: 'var(--c-green)', Trace: 'var(--c-teal)',
                  Ultratrace: 'var(--c-cyan)', 'Not essential': 'var(--c-slate)' };
    LENSES.bio = {
      name: 'Life',
      color: (e) => (e.bioClass ? BIO[e.bioClass] : null),
      value: (e) => e.bioRole || (e.bioClass ? `${e.bioClass.toLowerCase()} — no note yet` : 'no biological role recorded'),
      legend: () => [
        { label: 'bulk — 99.9 % of a body', color: BIO.Bulk },
        { label: 'trace, established', color: BIO.Trace },
        { label: 'essential to some organisms', color: BIO.Ultratrace },
        { label: 'no known role', color: BIO['Not essential'] },
        { label: 'not recorded', hollow: true }],
    };
  }
  for (const k of Object.keys(LENSES)) {
    const L = LENSES[k];
    if (L.seq) { L.color = (e) => { const t = L.t(e); return t == null ? null : heat(t); }; L.solid = true; }
  }

  // ---------- build grid ----------
  const ptable = document.getElementById('ptable');
  const frag = document.createDocumentFragment();
  const cell = (cls, txt, r, c) => {
    const d = document.createElement('div');
    d.className = cls; d.textContent = txt;
    d.style.gridRow = r; d.style.gridColumn = c;
    frag.appendChild(d); return d;
  };
  for (let g = 1; g <= 18; g++) cell('glabel', g, 1, g + 1);
  for (let p = 1; p <= 7; p++) cell('plabel', p, p + 1, 1);
  cell('marker', '57–71', 7, 4).title = 'Lanthanides — rows below';
  cell('marker', '89–103', 8, 4).title = 'Actinides — rows below';
  cell('fgap', '', 9, '1 / -1');

  const tiles = {};
  for (const e of E) {
    const b = document.createElement('button');
    b.className = 'tile';
    b.style.gridRow = e.row;
    b.style.gridColumn = e.col + 1;
    b.innerHTML = `<span class="z">${e.z}</span><span class="sym"></span><span class="nm"></span>`;
    b.querySelector('.sym').textContent = e.sym;
    b.querySelector('.nm').textContent = e.name;
    b.addEventListener('click', () => select(e.z));
    b.addEventListener('mousemove', (ev) => tipShow(e, ev));
    b.addEventListener('mouseleave', tipHide);
    tiles[e.z] = b;
    frag.appendChild(b);
  }
  ptable.appendChild(frag);

  // ---------- painting ----------
  let lens = 'cat';
  const temp = document.getElementById('temp');
  const year = document.getElementById('year');
  const q = document.getElementById('q');

  function paint() {
    const L = LENSES[lens];
    const query = q.value.trim().toLowerCase();
    for (const e of E) {
      const el = tiles[e.z];
      const color = L.color(e);
      if (color == null) {
        el.style.setProperty('--tile-bg', 'var(--panel)');
        el.style.setProperty('--tile-bd', 'var(--hairline)');
        el.classList.add('hollow');
      } else {
        el.classList.remove('hollow');
        if (L.solid) {
          el.style.setProperty('--tile-bg', color);
          el.style.setProperty('--tile-bd', 'color-mix(in oklab, var(--heat) 55%, var(--hairline))');
        } else {
          el.style.setProperty('--tile-bg', `color-mix(in oklab, ${color} 30%, var(--panel))`);
          el.style.setProperty('--tile-bd', `color-mix(in oklab, ${color} 60%, var(--panel))`);
        }
      }
      let ghost = false;
      if (query) ghost = !(e.name.toLowerCase().includes(query) || e.sym.toLowerCase() === query || String(e.z) === query);
      if (lens === 'disc' && e.discovered > year.valueAsNumber) ghost = true;
      el.classList.toggle('ghost', ghost);
    }
    paintLegend();
  }

  function paintLegend() {
    const L = LENSES[lens];
    const lg = document.getElementById('legend');
    lg.innerHTML = '';
    if (L.seq) {
      const [lo, hi] = L.range();
      const bar = document.createElement('div');
      bar.className = 'gradbar';
      bar.style.background = `linear-gradient(90deg, ${heat(0)}, ${heat(0.5)}, ${heat(1)})`;
      const mk = (t) => { const s = document.createElement('span'); s.className = 'mono-val mono'; s.textContent = t; return s; };
      lg.append(mk(lo), bar, mk(hi));
      const n = E.filter((e) => L.t(e) == null).length;
      if (n) { const s = document.createElement('span'); s.innerHTML = `<span class="chip"><span class="dot hollowdot"></span>no data (${n})</span>`; lg.append(s); }
      if (lens === 'disc') { const s = document.createElement('span'); s.textContent = 'drag the year to travel back in time'; lg.append(s); }
    } else {
      for (const item of L.legend()) {
        const c = document.createElement('span');
        c.className = 'chip';
        const dot = document.createElement('span');
        dot.className = 'dot' + (item.hollow ? ' hollowdot' : '');
        if (!item.hollow) dot.style.background = `color-mix(in oklab, ${item.color} 30%, var(--panel))`;
        if (!item.hollow) dot.style.borderColor = `color-mix(in oklab, ${item.color} 60%, var(--panel))`;
        c.append(dot, document.createTextNode(item.label));
        lg.appendChild(c);
      }
    }
  }

  // ---------- lens switcher ----------
  const lensesBox = document.getElementById('lenses');
  for (const [k, L] of Object.entries(LENSES)) {
    const b = document.createElement('button');
    b.className = 'lens';
    b.textContent = L.name;
    b.setAttribute('aria-pressed', String(k === lens));
    b.addEventListener('click', () => {
      lens = k;
      for (const x of lensesBox.children) x.setAttribute('aria-pressed', 'false');
      b.setAttribute('aria-pressed', 'true');
      document.getElementById('tempwrap').classList.toggle('on', L.slider === 'temp');
      document.getElementById('yearwrap').classList.toggle('on', L.slider === 'year');
      paint();
      if (sel) renderDetail(byZ[sel]);
    });
    lensesBox.appendChild(b);
  }

  temp.addEventListener('input', () => { document.getElementById('tempval').textContent = `${temp.valueAsNumber} °C`; paint(); if (sel) renderDetail(byZ[sel]); });
  year.addEventListener('input', () => { document.getElementById('yearval').textContent = fmtYear(year.valueAsNumber); paint(); });
  q.addEventListener('input', paint);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);

  // ---------- tooltip ----------
  const tip = document.getElementById('tip');
  function tipShow(e, ev) {
    const L = LENSES[lens];
    tip.innerHTML = `<div class="t1"></div><div class="t2"></div>`;
    tip.children[0].textContent = `${e.sym} · ${e.name} · ${e.z}`;
    tip.children[1].textContent = L.value(e);
    tip.style.display = 'block';
    const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8);
    const y = Math.min(ev.clientY + 16, innerHeight - tip.offsetHeight - 8);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function tipHide() { tip.style.display = 'none'; }

  // ---------- detail panel ----------
  let sel = null;
  function select(z) {
    if (sel) tiles[sel].classList.remove('sel');
    sel = z;
    tiles[z].classList.add('sel');
    renderDetail(byZ[z]);
  }
  addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && sel) {
      tiles[sel].classList.remove('sel');
      sel = null;
      document.getElementById('detail').innerHTML = '<p class="empty">Select an element to inspect it.</p>';
    }
  });

  function renderDetail(e) {
    const d = document.getElementById('detail');
    const catLabel = e.cat ? CAT_DEFS.find((c) => c.key === e.cat).label : 'unknown chemical properties';
    const color = e.cat ? catColor(e.cat) : null;
    const rows = [
      ['atomic mass', fmtNum(e.atomicMass, 'u')],
      ['group', e.groupNum ?? (e.z >= 89 && e.z <= 103 ? 'f-block · actinide' : 'f-block · lanthanide')],
      ['period', e.periodNum],
      ['block', e.block + '-block'],
      ['state 0 °C', e.state0C],
      ['state 20 °C', e.state20C === 'Unknown' ? null : e.state20C],
      ['melting pt', fmtNum(e.meltingPt, '°C')],
      ['boiling pt', fmtNum(e.boilingPt, '°C')],
      ['density', fmtNum(e.density, 'g/cm³')],
      ['origin', e.occurrence],
      ['discovered', fmtYear(e.discovered)],
      ['in the crust', e.abundance == null
        ? (e.occurrence === 'Synthetic' ? 'none — synthetic only' : null)
        : `${fmtPpm(e.abundance)} · ${abuRank.get(e.z)}${ordinal(abuRank.get(e.z))} rarest of ${abuRank.size}`],
    ];
    const dl = rows.map(([k, v]) =>
      `<dt>${k}</dt><dd class="${v == null ? 'none' : ''}">${v == null ? '— not in Notion' : v}</dd>`).join('');
    const tags = [...e.families, ...(e.unknownProps ? ['#Unknown Chemical Properties'] : [])]
      .map((t) => `<span class="tag"></span>`);
    d.innerHTML = `
      <div class="dhead">
        <div class="dsym" style="${color ? `--tile-bg: color-mix(in oklab, ${color} 30%, var(--panel)); --tile-bd: color-mix(in oklab, ${color} 60%, var(--panel));` : ''}">
          <span class="s"></span><span class="n"></span>
        </div>
        <div>
          <p class="dname"></p>
          <div class="dcat"></div>
        </div>
      </div>
      <dl class="props">${dl}</dl>
      <div class="tags"></div>
      <div class="derived-note"></div>
      <div class="dmins"></div>
      <div class="dext"></div>
      <div class="deqs"></div>
      <div class="dfoot">
        <a href="${e.pageUrl}" target="_blank" rel="noopener">open in Notion ↗</a>
        <span>edited ${new Date(e.lastEdited).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
      </div>`;
    d.querySelector('.dsym .s').textContent = e.sym;
    d.querySelector('.dsym .n').textContent = e.z;
    d.querySelector('.dname').textContent = e.name;
    d.querySelector('.dcat').textContent = catLabel + (e.catDerived ? ' · derived from group 1' : '');
    const tagbox = d.querySelector('.tags');
    for (const t of [...e.families, ...(e.unknownProps ? ['#Unknown Chemical Properties'] : [])]) {
      const s = document.createElement('span'); s.className = 'tag'; s.textContent = t.replace(/^#/, ''); tagbox.appendChild(s);
    }
    const notes = [];
    if (e.catDerived) notes.push('“Alkali metal” is derived from group 1 — the Notion row is tagged only #Metal.');
    if (rows.some(([, v]) => v == null)) notes.push('Dashes are genuine gaps in the Notion database, not zeros.');
    d.querySelector('.derived-note').textContent = notes.join(' ');

    // minerals that contain this element (decoded from the Minerals database)
    const mi = MIN[e.sym];
    if (mi) {
      const box = d.querySelector('.dmins');
      const h2 = document.createElement('div');
      h2.className = 'deqs-h';
      h2.textContent = `minerals · ${mi.n.toLocaleString('en')}`;
      box.appendChild(h2);
      const list = document.createElement('div');
      list.className = 'deqs-list';
      for (const nm of mi.examples) {
        const a = document.createElement('a');
        a.className = 'dmin';
        a.href = '/minerals#' + encodeURIComponent(nm.toLowerCase());
        a.textContent = nm;
        list.appendChild(a);
      }
      const all = document.createElement('a');
      all.className = 'dmin all';
      all.href = '/minerals?el=' + e.sym;
      all.textContent = mi.n > mi.examples.length ? `all ${mi.n.toLocaleString('en')} →` : 'browse →';
      all.title = `Filter the minerals collection to ${e.name}-bearing minerals`;
      list.appendChild(all);
      box.appendChild(list);
    }

    // sources & extraction (scripts/seed_mining.py): where it comes from and how it is won
    if (e.minedAs || e.extraction || e.oreGrade != null) {
      const box = d.querySelector('.dext');
      const h = document.createElement('div');
      h.className = 'deqs-h';
      h.textContent = 'sources & extraction' + (e.minedAs ? ` · ${e.minedAs.toLowerCase()}` : '');
      box.appendChild(h);
      const facts = [];
      if (e.oreMinerals) facts.push(['ore minerals', e.oreMinerals]);
      if (e.oreGrade != null) {
        facts.push(['typical ore grade', fmtPpm(e.oreGrade)]);
        if (e.abundance) {
          const f = e.oreGrade / e.abundance;
          facts.push(['concentration factor', `${fmtFactor(f)}× the crust — ` +
            (f < 10 ? 'barely enriched; mined by the billion tonnes' :
             f < 100 ? 'modestly enriched ore bodies' :
             f < 1000 ? 'needs a real ore deposit' :
             f < 10000 ? 'only where geology has concentrated it hard' :
             'freakish enrichment — a handful of deposits on Earth')]);
        }
      }
      if (facts.length) {
        const dl = document.createElement('dl');
        dl.className = 'props dext-facts';
        for (const [k, v] of facts) {
          const dt = document.createElement('dt'); dt.textContent = k;
          const dd = document.createElement('dd'); dd.textContent = v;
          dl.append(dt, dd);
        }
        box.appendChild(dl);
      }
      if (e.extraction) {
        const p = document.createElement('p');
        p.className = 'dext-text';
        p.textContent = e.extraction;
        box.appendChild(p);
      }
      const sites = (e.mines || []).map((id) => MINESITES[id]).filter(Boolean)
        .sort((a, b) => a.name.localeCompare(b.name));
      if (sites.length) {
        const list = document.createElement('div');
        list.className = 'deqs-list';
        for (const m of sites) {
          const a = document.createElement('a');
          a.className = 'dmine';
          a.href = '/mines#' + m.slug;
          a.textContent = m.name;
          a.title = `${m.country} · ${vocab(m.type)}`;
          list.appendChild(a);
        }
        const all = document.createElement('a');
        all.className = 'dmine all';
        all.href = '/mines?el=' + e.sym;
        all.textContent = 'on the map →';
        list.appendChild(all);
        box.appendChild(list);
      }
    }

    // equations that concern this element (Notion relation, mirrored from the Equations DB)
    const eqs = (e.equations || []).map((id) => EQ[id]).filter(Boolean)
      .sort((a, b) => a.name.localeCompare(b.name));
    if (eqs.length) {
      const box = d.querySelector('.deqs');
      const h = document.createElement('div');
      h.className = 'deqs-h';
      h.textContent = `equations · ${eqs.length}`;
      box.appendChild(h);
      const list = document.createElement('div');
      list.className = 'deqs-list';
      for (const q of eqs) {
        const a = document.createElement('a');
        a.className = 'deq';
        a.href = '/equations#' + q.slug;
        a.title = vocab(q.field) || '';
        a.textContent = q.name;
        list.appendChild(a);
      }
      box.appendChild(list);
    }
  }

  // deep links: /elements#fe opens iron
  function openHash() {
    const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    if (!h) return;
    const hit = E.find((e) => e.sym.toLowerCase() === h || String(e.z) === h);
    if (hit) { select(hit.z); tiles[hit.z].scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  }
  addEventListener('hashchange', openHash);

  // ---------- provenance ----------
  const lastEdit = new Date(Math.max(...E.map((e) => Date.parse(e.lastEdited))));
  const gaps = E.filter((e) => e.meltingPt == null || e.boilingPt == null || e.density == null || e.occurrence == null).length;
  document.getElementById('prov').textContent =
    `${E.length} elements · last Notion edit ${lastEdit.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })} · ${gaps} elements have gaps`;

  document.getElementById('tempval').textContent = '20 °C';
  paint();
  openHash();
</script>
