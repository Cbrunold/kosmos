<script id="data" type="application/json">[{"url":"https://app.notion.com/p/Logistic-Map-3bbe52757b5c8120a62dfa870a7c75bb","lastEdited":"2026-08-13T21:33:00.000Z","Equation":"xₙ₊₁ = r·xₙ·(1 − xₙ)","Field":"Nonlinear Dynamics","Named After":"Robert May","Symbols":"xₙ this year's population, as a fraction of maximum · r the growth rate knob · iterate to get next year, and the next","Significance":"One line of arithmetic a child could iterate: below r ≈ 3 it settles, then oscillates, then doubles and doubles again — and past 3.5699… it's chaos. May's point, made with an ecology model, was that wild complexity needs no complicated cause; the simplest feedback suffices.","Year":1976,"Name":"Logistic Map"},{"url":"https://app.notion.com/p/Feigenbaum-Constant-3bbe52757b5c813eaf26d6744c7f4db2","lastEdited":"2026-08-13T21:33:00.000Z","Equation":"δ = lim (rₙ − rₙ₋₁)/(rₙ₊₁ − rₙ) ≈ 4.6692…","Field":"Nonlinear Dynamics","Named After":"Mitchell Feigenbaum","Symbols":"rₙ the parameter values where the period doubles again (2, 4, 8, …) · δ the universal ratio at which those doublings accelerate toward chaos","Significance":"On the road to chaos, the period-doublings arrive geometrically faster — and the ratio is the same number for the logistic map, dripping faucets, and convecting fluids alike. A new universal constant of nature discovered on a programmable calculator.","Year":1975,"Name":"Feigenbaum Constant"},{"url":"https://app.notion.com/p/Lorenz-System-3bbe52757b5c8132a437e09561425c4c","lastEdited":"2026-08-13T21:33:00.000Z","Equation":"ẋ = σ(y−x) · ẏ = x(ρ−z) − y · ż = xy − βz","Field":"Nonlinear Dynamics","Named After":"Edward Lorenz","Symbols":"x, y, z the state of a drastically simplified convecting atmosphere · σ, ρ, β knobs for the fluid's properties · the dots are time derivatives","Significance":"Three innocuous-looking equations whose solutions never settle and never repeat, tracing the butterfly-shaped attractor that named an effect: Lorenz found that rounding a starting value in the fourth decimal produced a different weather forecast entirely. Deterministic yet unpredictable — the discovery that killed Laplace's demon.","Year":1963,"Name":"Lorenz System"},{"url":"https://app.notion.com/p/Goldman-Hodgkin-Katz-Equation-3bbe52757b5c81b484faeccd5252bf7c","lastEdited":"2026-08-13T21:28:00.000Z","Equation":"V_m = (RT/F)·ln(ΣP·[ion]ₒᵤₜ / ΣP·[ion]ᵢₙ)","Field":"Biophysics","Named After":"David Goldman · Alan Hodgkin · Bernard Katz","Symbols":"V_m the membrane's resting voltage · P each ion's permeability (weighting its vote) · the sums run over K⁺, Na⁺, Cl⁻ · reduces to Nernst when one ion dominates","Significance":"Real membranes listen to several ions at once, each weighted by how easily it passes — the ~−70 mV hum of a resting neuron. Flip the sodium permeability and the voltage spikes: that reversal, propagating down the axon, is the nerve impulse reading this sentence.","Year":1943,"Name":"Goldman–Hodgkin–Katz Equation"},{"url":"https://app.notion.com/p/Michaelis-Menten-Equation-3bbe52757b5c81ee97dcc7e65a4e1ad2","lastEdited":"2026-08-13T21:28:00.000Z","Equation":"v = V_max·[S] / (K_m + [S])","Field":"Biophysics","Named After":"Leonor Michaelis · Maud Menten","Symbols":"v reaction rate · [S] substrate concentration · V_max the enzyme's top speed, all sites busy · K_m the concentration at half speed — the enzyme's affinity signature","Significance":"How enzymes work: fast when fed, saturating when swamped — a hyperbola that describes digestion, drug metabolism, and nearly every reaction keeping you alive. Menten was one of the first women in medical research; the equation still anchors pharmacology dosing.","Year":1913,"Name":"Michaelis–Menten Equation"},{"url":"https://app.notion.com/p/Nernst-Equation-3bbe52757b5c81b29ec2d967f8695b7e","lastEdited":"2026-08-13T21:28:00.000Z","Equation":"E = (RT/zF)·ln([ion]ₒᵤₜ/[ion]ᵢₙ)","Field":"Biophysics","Named After":"Walther Nernst","Symbols":"E equilibrium voltage for one ion species · R gas constant · T absolute temperature · z the ion's charge · F Faraday's constant · the log compares concentrations outside and inside the membrane","Significance":"A concentration difference across a membrane is a battery — about −90 mV for potassium in your neurons, right now. Born in electrochemistry (it prices every battery's voltage too), it became the foundation stone of electrophysiology: nerves run on Nernst.","Year":1889,"Name":"Nernst Equation"},{"url":"https://app.notion.com/p/Gaussian-Beam-Divergence-3bbe52757b5c81748c31eda1293e8fe6","lastEdited":"2026-08-13T21:25:00.000Z","Equation":"θ = λ / (π·w₀)","Field":"Photonics","Named After":"Herwig Kogelnik · Tingye Li","Symbols":"θ far-field half-angle of spread · λ wavelength · w₀ the beam waist, its narrowest radius · diffraction makes tighter focus mean faster spread","Significance":"A laser beam cannot stay pencil-thin forever — diffraction spreads it at an angle set by wavelength over waist. The trade is fundamental: focus harder, diverge faster. It's why lunar ranging beams leave Earth centimetres wide and arrive kilometres wide, and still come home with an answer.","Year":1966,"Name":"Gaussian Beam Divergence"},{"url":"https://app.notion.com/p/Laser-Rate-Equations-3bbe52757b5c816e831de184b1a1f659","lastEdited":"2026-08-13T21:25:00.000Z","Equation":"dN/dt = P − N/τ − B·N·φ  ·  dφ/dt = B·N·φ − φ/τ_c","Field":"Photonics","Named After":"Hermann Statz · George deMars","Symbols":"N population inversion (excited atoms) · φ photon number in the cavity · P pumping rate · τ excited-state lifetime · τ_c cavity photon lifetime · B stimulated-emission strength","Significance":"The laser as a ledger: pumping fills the upper level, photons breed photons off the inversion, the cavity leaks. Above a pump threshold the light term runs away and the cavity blazes coherently — written in the very year Maiman's ruby laser first flashed, and still how engineers model everything from laser pointers to fiber amplifiers.","Year":1960,"Name":"Laser Rate Equations"},{"url":"https://app.notion.com/p/Einstein-A-and-B-Coefficients-3bbe52757b5c818e8ccfc5b952277817","lastEdited":"2026-08-13T21:25:00.000Z","Equation":"A₂₁/B₂₁ = 8πhν³/c³","Field":"Photonics","Named After":"Albert Einstein","Symbols":"A₂₁ rate of spontaneous emission · B₂₁ rate of stimulated emission per unit radiation density · ν frequency of the transition · h Planck constant · c speed of light","Significance":"Einstein's thermodynamic bookkeeping of light and atoms demanded a third process nobody had seen: an incoming photon can tickle an excited atom into emitting an identical twin — same direction, same phase. Stimulated emission sat as a curiosity for four decades, then became the L, A, S, E and R of 'laser'.","Year":1917,"Name":"Einstein A and B Coefficients"},{"url":"https://app.notion.com/p/Thermoelectric-Figure-of-Merit-3bbe52757b5c812db464f7799b61cce9","lastEdited":"2026-08-13T21:23:00.000Z","Equation":"zT = S²·σ·T / κ","Field":"Thermoelectrics","Named After":"Abram Ioffe","Symbols":"S Seebeck coefficient · σ electrical conductivity · κ thermal conductivity · T absolute temperature · dimensionless — bigger is better, and above ~1 is device-worthy","Significance":"The materials-hunt scorecard: a good thermoelectric conducts electricity like a metal but heat like a glass — a contradiction to engineer around. Radioisotope generators score just well enough to power Voyager and the Mars rovers on decay heat, decades from the Sun.","Year":1949,"Name":"Thermoelectric Figure of Merit"},{"url":"https://app.notion.com/p/Peltier-Effect-3bbe52757b5c8110a092dab2770885be","lastEdited":"2026-08-13T21:23:00.000Z","Equation":"Q̇ = Π·I","Field":"Thermoelectrics","Named After":"Jean Charles Athanase Peltier","Symbols":"Q̇ heat absorbed or released at a junction of two materials · I electric current through it · Π the Peltier coefficient, tied to Seebeck's by Π = S·T","Significance":"Run the Seebeck effect backwards: push current through a junction and it pumps heat from one side to the other — a solid-state refrigerator. Camping coolers, CPU chillers, and laser stabilizers all run on this thirteen-years-later mirror image.","Year":1834,"Name":"Peltier Effect"},{"url":"https://app.notion.com/p/Seebeck-Effect-3bbe52757b5c814d8154c3d16384df7f","lastEdited":"2026-08-13T21:23:00.000Z","Equation":"V = −S·ΔT","Field":"Thermoelectrics","Named After":"Thomas Johann Seebeck","Symbols":"V voltage generated · ΔT temperature difference across the material · S the Seebeck coefficient, the material's signature (microvolts per kelvin)","Significance":"Hold one end of a conductor hot and the other cold, and a voltage appears — heat turned directly into electricity with no moving parts. Seebeck misread his own discovery as 'thermomagnetism'; the thermocouple it spawned is still how most of industry measures temperature.","Year":1821,"Name":"Seebeck Effect"},{"url":"https://app.notion.com/p/Magnetic-Reynolds-Number-3bbe52757b5c810381ffe3a91328a314","lastEdited":"2026-08-13T21:18:00.000Z","Equation":"R_m = v·L / η","Field":"Magnetohydrodynamics","Named After":"Walter Elsasser · after Osborne Reynolds","Symbols":"v flow speed · L size of the system · η magnetic diffusivity · dimensionless — big R_m means the field is frozen into the fluid, small means it slips through","Significance":"One number that decides the regime: in Earth's core and the Sun (R_m huge) field lines are frozen into the flow and can be wound up into a dynamo — Elsasser's explanation for why Earth is a magnet at all. In the lab (R_m small) the field barely notices the fluid.","Year":1946,"Name":"Magnetic Reynolds Number"},{"url":"https://app.notion.com/p/Alfv-n-Velocity-3bbe52757b5c81c5abe1d9f8b479e14f","lastEdited":"2026-08-13T21:18:00.000Z","Equation":"v_A = B / √(μ₀·ρ)","Field":"Magnetohydrodynamics","Named After":"Hannes Alfvén","Symbols":"v_A speed of magnetic waves along the field · B magnetic field strength · μ₀ permeability of free space · ρ fluid density","Significance":"Magnetic field lines behave like plucked strings under tension, carrying waves at this speed — an idea so strange it was ignored until Fermi nodded at a seminar. Alfvén waves thread the solar wind and corona, and the 1970 Nobel followed.","Year":1942,"Name":"Alfvén Velocity"},{"url":"https://app.notion.com/p/MHD-Induction-Equation-3bbe52757b5c814d9bc3ef9ce2d272dc","lastEdited":"2026-08-13T21:18:00.000Z","Equation":"∂B/∂t = ∇×(v×B) + η·∇²B","Field":"Magnetohydrodynamics","Named After":"Hannes Alfvén","Symbols":"B magnetic field · v velocity of the conducting fluid · η magnetic diffusivity · the first term carries the field with the flow, the second lets it slip and decay","Significance":"How a magnetic field evolves inside a moving conducting fluid — stirred by the flow, leaking by diffusion. It's Faraday's induction married to fluid dynamics, and it governs the Sun's boiling field, Earth's core, and every fusion plasma.","Year":1942,"Name":"MHD Induction Equation"},{"url":"https://app.notion.com/p/Josephson-Effect-3bbe52757b5c81de99a6fb82df0033a9","lastEdited":"2026-08-13T21:16:00.000Z","Equation":"I = I_c·sin(φ₁ − φ₂)","Field":"Superconductivity","Named After":"Brian Josephson","Symbols":"I supercurrent through a thin insulating barrier · I_c the junction's critical current · φ₁, φ₂ quantum phases of the superconductors on each side","Significance":"Current flows through an insulator with no voltage at all, steered only by quantum phase — predicted by a 22-year-old graduate student. Josephson junctions are the working element of SQUID magnetometers, the definition of the volt, and the superconducting qubits inside today's quantum computers.","Year":1962,"Name":"Josephson Effect"},{"url":"https://app.notion.com/p/BCS-Energy-Gap-3bbe52757b5c8149a0e6d2bf67397229","lastEdited":"2026-08-13T21:16:00.000Z","Equation":"Δ(0) ≈ 1.76·k_B·T_c","Field":"Superconductivity","Named After":"John Bardeen · Leon Cooper · Robert Schrieffer","Symbols":"Δ the energy gap protecting the superconducting state · k_B Boltzmann constant · T_c the critical temperature where superconductivity dies","Significance":"The mechanism, 46 years after the discovery: electrons pair up (Cooper pairs), glued by lattice vibrations, and condense into one collective quantum state protected by this gap — too costly for stray collisions to break, so current flows forever. Bardeen's second Nobel.","Year":1957,"Name":"BCS Energy Gap"},{"url":"https://app.notion.com/p/London-Equations-3bbe52757b5c81b2ae34f800aecd57e1","lastEdited":"2026-08-13T21:16:00.000Z","Equation":"∂J/∂t = (n_s·e²/mₑ)·E  ·  ∇×J = −(n_s·e²/mₑ)·B","Field":"Superconductivity","Named After":"Fritz London · Heinz London","Symbols":"J supercurrent density · n_s density of superconducting electrons · E, B electric and magnetic fields · fields penetrate only the London depth λ_L = √(mₑ/(μ₀·n_s·e²))","Significance":"Two lines that capture superconductivity's twin miracles: current accelerates freely with no resistance, and magnetic fields are expelled from the interior — the Meissner effect, which is why superconductors levitate magnets. Written by refugee brothers two years after the expulsion was discovered.","Year":1935,"Name":"London Equations"},{"url":"https://app.notion.com/p/Bloch-s-Theorem-3bbe52757b5c81d1abadc2702fa3abb0","lastEdited":"2026-08-13T21:13:00.000Z","Equation":"ψ_k(r) = e^(i·k·r)·u_k(r)","Field":"Condensed Matter","Named After":"Felix Bloch","Symbols":"ψ_k electron wavefunction in a crystal · k crystal momentum · u_k a function with the lattice's own periodicity · the plane wave e^(i·k·r) rides the lattice unimpeded","Significance":"The Schrödinger equation solved in the periodic potential of a crystal: electrons travel as waves shaped by the lattice, scattering only off imperfections — why copper conducts at all. The allowed and forbidden energies this form produces are the band structure, the blueprint of every material's electronic personality.","Year":1928,"Name":"Bloch's Theorem"},{"url":"https://app.notion.com/p/Fermi-Dirac-Distribution-3bbe52757b5c81e196c0c6157aaee509","lastEdited":"2026-08-13T21:13:00.000Z","Equation":"f(E) = 1 / (e^((E−μ)/kT) + 1)","Field":"Condensed Matter","Named After":"Enrico Fermi · Paul Dirac","Symbols":"f(E) probability an electron state of energy E is occupied · μ chemical potential (the Fermi level) · k Boltzmann constant · T temperature · the +1 encodes the exclusion principle","Significance":"Electrons refuse to share states, so they stack up to a filling line — the Fermi level. Everything electronic follows from where that line sits: metals have it mid-band, insulators in a gap, and semiconductors close enough to a band edge to be persuaded — which is the transistor.","Year":1926,"Name":"Fermi–Dirac Distribution"},{"url":"https://app.notion.com/p/Drude-Conductivity-3bbe52757b5c81ee9b16dcfba043e1f3","lastEdited":"2026-08-13T21:13:00.000Z","Equation":"σ = n·e²·τ / mₑ","Field":"Condensed Matter","Named After":"Paul Drude","Symbols":"σ electrical conductivity · n density of free electrons · e electron charge · τ average time between collisions · mₑ electron mass","Significance":"Metals as a pinball sea of electrons, drifting between collisions — proposed three years after the electron's discovery. Crude but unreasonably effective: it still gives the right form for conductivity, and its failures pointed straight at the quantum theory of solids.","Year":1900,"Name":"Drude Conductivity"},{"url":"https://app.notion.com/p/Lawson-Criterion-3bbe52757b5c817f80a4f6e36ff9d306","lastEdited":"2026-08-13T21:11:00.000Z","Equation":"n·T·τ_E ≥ 3×10²¹ keV·s/m³","Field":"Plasma Physics","Named After":"John D. Lawson","Symbols":"n fuel density · T temperature · τ_E energy confinement time — how long the heat stays put · the triple product a fusion plasma must exceed to yield net power","Significance":"The finish line for fusion power: hold a plasma dense enough, hot enough, long enough — achieve any two and the third gets you. Tokamaks chase confinement time, laser fusion chases density; seven decades on, the race against this one inequality continues.","Year":1957,"Name":"Lawson Criterion"},{"url":"https://app.notion.com/p/Plasma-Frequency-3bbe52757b5c819da258d3e7dec3b639","lastEdited":"2026-08-13T21:11:00.000Z","Equation":"ω_p = √(n·e² / (ε₀·mₑ))","Field":"Plasma Physics","Named After":"Lewi Tonks · Irving Langmuir","Symbols":"ω_p natural sloshing frequency of the electrons · n electron density · e electron charge · ε₀ permittivity of free space · mₑ electron mass","Significance":"Displace a plasma's electrons and they slosh back at this frequency — waves below it bounce off, waves above pass through. It's why shortwave radio skips off the ionosphere to cross oceans, and why metals (a plasma of conduction electrons) are shiny mirrors to visible light.","Year":1929,"Name":"Plasma Frequency"},{"url":"https://app.notion.com/p/Debye-Length-3bbe52757b5c816c8a1dc37099e0ec76","lastEdited":"2026-08-13T21:11:00.000Z","Equation":"λ_D = √(ε₀·k_B·T / (n·e²))","Field":"Plasma Physics","Named After":"Peter Debye · Erich Hückel","Symbols":"λ_D the screening distance · ε₀ permittivity of free space · k_B Boltzmann constant · T temperature · n electron density · e electron charge","Significance":"In a soup of free charges, any stray electric field is smothered within this distance — beyond it the plasma looks neutral. It's the definition of the state of matter itself: a gas counts as plasma only when it's much bigger than its own Debye length. Born, oddly, in the chemistry of salt solutions.","Year":1923,"Name":"Debye Length"},{"url":"https://app.notion.com/p/Escape-Velocity-3bbe52757b5c813a84a7ea08528b3c93","lastEdited":"2026-08-13T21:08:00.000Z","Equation":"v_esc = √(2GM/r)","Field":"Celestial Mechanics","Named After":"Isaac Newton","Symbols":"v_esc minimum speed to leave forever, ignoring drag · G gravitational constant · M mass of the body · r starting distance from its centre","Significance":"The vis-viva equation with the orbit opened to infinity — 11.2 km/s from Earth's surface, 2.4 from the Moon, 620 from the Sun. Set v_esc equal to the speed of light and Schwarzschild's radius appears two centuries early: John Michell imagined 'dark stars' this way in 1783.","Year":1687,"Name":"Escape Velocity"},{"url":"https://app.notion.com/p/Vis-Viva-Equation-3bbe52757b5c810a8065f03f5253cda9","lastEdited":"2026-08-13T21:08:00.000Z","Equation":"v² = GM·(2/r − 1/a)","Field":"Celestial Mechanics","Named After":"Isaac Newton","Symbols":"v orbital speed at distance r from the central body · a semi-major axis of the orbit · G gravitational constant · M central mass · for a circular orbit r = a and v = √(GM/r)","Significance":"Speed anywhere along any orbit from energy bookkeeping alone — 'vis viva' is Leibniz's name for what we now call kinetic energy. The everyday tool of mission design: every Hohmann transfer, gravity assist, and orbital insertion burn starts from this line.","Year":1687,"Name":"Vis-Viva Equation"},{"url":"https://app.notion.com/p/Qubit-State-3bbe52757b5c81038865faee50cc9c18","lastEdited":"2026-08-13T21:03:00.000Z","Equation":"|ψ⟩ = α|0⟩ + β|1⟩,  |α|² + |β|² = 1","Field":"Quantum Computing","Named After":"Benjamin Schumacher (coined 'qubit')","Symbols":"|0⟩, |1⟩ the two classical answers · α, β complex amplitudes weighting each · measurement yields 0 with probability |α|², 1 with |β|²","Significance":"A bit that holds both answers at once, in precise proportions, until measured — the unit of quantum information. n qubits span 2ⁿ amplitudes simultaneously, which is the entire bet behind quantum computing; Schumacher named it while proving quantum states can be compressed, Shannon-style.","Year":1995,"Name":"Qubit State"},{"url":"https://app.notion.com/p/No-Cloning-Theorem-3bbe52757b5c810ea378ea77aa50d6f6","lastEdited":"2026-08-13T21:03:00.000Z","Equation":"no U exists with U(|ψ⟩|0⟩) = |ψ⟩|ψ⟩","Field":"Quantum Computing","Named After":"William Wootters · Wojciech Zurek · Dennis Dieks","Symbols":"|ψ⟩ an arbitrary unknown quantum state · U any allowed (unitary) operation · the theorem: no universal copier is possible","Significance":"Unknown quantum states cannot be photocopied — linearity forbids it. The apparent handicap is a feature: an eavesdropper can't copy a quantum key without leaving fingerprints, which makes quantum cryptography possible, and it's why quantum error correction had to be invented rather than borrowed.","Year":1982,"Name":"No-Cloning Theorem"},{"url":"https://app.notion.com/p/Bell-State-3bbe52757b5c810f8c8dd0d1ca4da44e","lastEdited":"2026-08-13T21:03:00.000Z","Equation":"|Φ⁺⟩ = (|00⟩ + |11⟩)/√2","Field":"Quantum Computing","Named After":"John Stewart Bell","Symbols":"|00⟩, |11⟩ both qubits reading zero, or both reading one · the superposition holds the pair in perfect correlation with neither value decided","Significance":"Two qubits sharing one state: measure either and the other's answer is fixed instantly, however far apart. Bell showed no hidden local mechanism can fake these correlations — entanglement is real, and it is the working fuel of quantum computing, teleportation, and quantum cryptography.","Year":1964,"Name":"Bell State"},{"url":"https://app.notion.com/p/Bragg-s-Law-3bbe52757b5c81139b17e6d7efc091ea","lastEdited":"2026-08-13T21:00:00.000Z","Equation":"2d·sin θ = n·λ","Field":"Waves & Optics","Named After":"William Henry Bragg · William Lawrence Bragg","Symbols":"d spacing between atomic planes in a crystal · θ grazing angle of the X-ray beam · n order · λ X-ray wavelength","Significance":"Crystals diffract X-rays as if their atomic planes were mirrors — measure the angles and you read the atomic architecture itself. A father-son Nobel (the son, at 25, still the youngest science laureate); it revealed the structure of salt, diamond, and eventually DNA.","Year":1913,"Name":"Bragg's Law"},{"url":"https://app.notion.com/p/Diffraction-Grating-Equation-3bbe52757b5c8130a1e2d4d1fefda7d8","lastEdited":"2026-08-13T21:00:00.000Z","Equation":"d·sin θ = m·λ","Field":"Waves & Optics","Named After":"Joseph von Fraunhofer","Symbols":"d spacing between the grating's slits or grooves · θ angle of the bright beam · m order (0, ±1, ±2, …) · λ wavelength of the light","Significance":"Many slits in lockstep fling each wavelength to its own angle — light sorted by color with ruler-like precision. Fraunhofer used it to map the Sun's dark spectral lines; gratings still sit at the heart of every spectrometer, and a CD's rainbow is the equation at play.","Year":1821,"Name":"Diffraction Grating Equation"},{"url":"https://app.notion.com/p/Einstein-Hilbert-Action-3bbe52757b5c815f8f49fde9509c1e77","lastEdited":"2026-08-13T20:53:00.000Z","Equation":"S = (c⁴/16πG)·∫R·√(−g)·d⁴x","Field":"General Relativity","Named After":"David Hilbert · Albert Einstein","Symbols":"R the Ricci scalar, total curvature at each point · g determinant of the metric · the integral runs over all of spacetime · varying S yields the field equations","Significance":"All of general relativity compressed into one thing to minimize: spacetime arranges itself to extremize total curvature. Hilbert reached the field equations this way days before Einstein's own derivation — and the action form is the doorway every attempt at quantum gravity walks through.","Year":1915,"Name":"Einstein–Hilbert Action"},{"url":"https://app.notion.com/p/Geodesic-Equation-3bbe52757b5c813baa6cdd6ce2e33cbf","lastEdited":"2026-08-13T20:53:00.000Z","Equation":"d²x^μ/dτ² + Γ^μ_αβ·(dx^α/dτ)(dx^β/dτ) = 0","Field":"General Relativity","Named After":"Albert Einstein","Symbols":"x^μ position in spacetime · τ proper time along the worldline · Γ^μ_αβ Christoffel symbols, the local record of spacetime curvature","Significance":"There is no force of gravity — falling things simply follow the straightest possible line through curved spacetime. Planetary orbits, the bending of starlight, and your fall off a ladder are all the same statement: mass tells spacetime how to curve, and this equation is how spacetime tells matter to move.","Year":1915,"Name":"Geodesic Equation"},{"url":"https://app.notion.com/p/Gravitational-Time-Dilation-3bbe52757b5c81efb92bd35cea11b9be","lastEdited":"2026-08-13T20:53:00.000Z","Equation":"Δτ = Δt·√(1 − 2GM/(rc²))","Field":"General Relativity","Named After":"Albert Einstein","Symbols":"Δτ time ticked by a clock at radius r from mass M · Δt time far away · G gravitational constant · c speed of light · the factor under the root hits zero at the event horizon","Significance":"Clocks deeper in gravity run slower — predicted from the equivalence principle years before the full theory existed. Not an abstraction: GPS satellites' clocks gain 45 microseconds a day over yours, and without this correction positions would drift kilometres per day.","Year":1907,"Name":"Gravitational Time Dilation"},{"url":"https://app.notion.com/p/Feynman-Path-Integral-3bbe52757b5c815db970fb2a7877db25","lastEdited":"2026-08-13T20:50:00.000Z","Equation":"⟨x_f|x_i⟩ = ∫Dx·e^(iS[x]/ℏ)","Field":"Quantum Field Theory","Named After":"Richard Feynman","Symbols":"⟨x_f|x_i⟩ amplitude to go from one point to another · ∫Dx a sum over every conceivable path between them · S[x] the classical action along each path · ℏ sets the scale of quantum interference","Significance":"A particle takes every possible path at once, each contributing a spinning phase — most cancel, and what survives is what we observe. When ℏ is small the stationary-action path wins, which is why classical mechanics' least-action principle works at all. The computational engine of modern QFT, from Feynman diagrams to lattice simulations.","Year":1948,"Name":"Feynman Path Integral"},{"url":"https://app.notion.com/p/Klein-Gordon-Equation-3bbe52757b5c812f8b13c3f401ee3a47","lastEdited":"2026-08-13T20:50:00.000Z","Equation":"(□ + (mc/ℏ)²)φ = 0","Field":"Quantum Field Theory","Named After":"Oskar Klein · Walter Gordon","Symbols":"φ a scalar field · □ the d'Alembertian, ∂²/c²∂t² − ∇² (the wave operator of spacetime) · m the field quantum's mass · ℏ, c the usual constants","Significance":"The first relativistic quantum equation — the wave equation and E = mc² fused into one. Set aside when it seemed to misbehave for electrons (Dirac fixed that), it returned as the equation every spinless field obeys, the Higgs included.","Year":1926,"Name":"Klein–Gordon Equation"},{"url":"https://app.notion.com/p/Fine-Structure-Constant-3bbe52757b5c811f8db4cc95acf776dd","lastEdited":"2026-08-13T20:50:00.000Z","Equation":"α = e²/(4πε₀ℏc) ≈ 1/137","Field":"Quantum Field Theory","Named After":"Arnold Sommerfeld","Symbols":"e electron charge · ε₀ permittivity of free space · ℏ reduced Planck constant · c speed of light · dimensionless — the same number for any choice of units","Significance":"The strength of electromagnetism distilled to one pure number, about 1/137 — small enough that atoms are stable and QED can be computed as a series of corrections. Why 137? Nobody knows; Feynman called it 'one of the greatest damn mysteries of physics'.","Year":1916,"Name":"Fine-Structure Constant"},{"url":"https://app.notion.com/p/Kirchhoff-s-Circuit-Laws-3bbe52757b5c81d481e7d91b9c8c327c","lastEdited":"2026-08-13T20:47:00.000Z","Equation":"Σ I = 0 at a node · Σ V = 0 around a loop","Field":"Circuits","Named After":"Gustav Kirchhoff","Symbols":"I currents meeting at a junction · V voltage rises and drops around any closed loop · signs by direction","Significance":"Charge doesn't pile up and energy books balance — conservation laws dressed for circuit analysis, written by Kirchhoff as a 21-year-old student. Together with Ohm's law they solve any network of wires, from a flashlight to a motherboard.","Year":1845,"Name":"Kirchhoff's Circuit Laws"},{"url":"https://app.notion.com/p/Joule-Heating-3bbe52757b5c816d9734c149c749519c","lastEdited":"2026-08-13T20:47:00.000Z","Equation":"P = I²·R","Field":"Circuits","Named After":"James Prescott Joule","Symbols":"P power dissipated as heat · I current · R resistance · equivalently P = V·I","Significance":"Current forcing its way through resistance sheds energy as heat — toasters, fuses, and incandescent filaments on purpose; warm laptops and power-line losses by accident. The I² is why the grid transmits at high voltage and low current.","Year":1841,"Name":"Joule Heating"},{"url":"https://app.notion.com/p/Ohm-s-Law-3bbe52757b5c8154bcd6c1cd26ae1a20","lastEdited":"2026-08-13T20:47:00.000Z","Equation":"V = I·R","Field":"Circuits","Named After":"Georg Simon Ohm","Symbols":"V voltage across a component · I current through it · R its resistance","Significance":"Current flows in proportion to the voltage pushing it — the straight line every circuit design starts from. Dismissed as 'a web of naked fancies' when published; now it's the first equation every electronics student learns.","Year":1827,"Name":"Ohm's Law"},{"url":"https://app.notion.com/p/Shannon-Hartley-Channel-Capacity-3bbe52757b5c81f88be6c617460fd271","lastEdited":"2026-08-13T20:45:00.000Z","Equation":"C = B·log₂(1 + S/N)","Field":"Information Theory","Named After":"Claude Shannon · Ralph Hartley","Symbols":"C maximum error-free data rate (bits per second) · B bandwidth of the channel · S/N signal-to-noise power ratio","Significance":"Every noisy channel has an exact speed limit — and below it, astonishingly, communication can be made error-free with clever coding. The theorem every modem, Wi-Fi router, 5G mast, and deep-space probe has spent seventy years engineering toward.","Year":1948,"Name":"Shannon–Hartley Channel Capacity"},{"url":"https://app.notion.com/p/Shannon-Entropy-3bbe52757b5c81f7a591c741011f5a20","lastEdited":"2026-08-13T20:45:00.000Z","Equation":"H = −Σᵢ pᵢ·log₂ pᵢ","Field":"Information Theory","Named After":"Claude Shannon","Symbols":"H information content in bits · pᵢ probability of each possible message · rare messages carry more information than expected ones","Significance":"How much surprise a message carries — the definition of the bit, and the hard floor below which no compression can squeeze data. The formula is Boltzmann's entropy in new clothes, a connection Shannon knew: information and thermodynamic disorder are the same mathematics.","Year":1948,"Name":"Shannon Entropy"},{"url":"https://app.notion.com/p/Eyring-Equation-3bbe52757b5c81f5a5b1f6059d15a3b7","lastEdited":"2026-08-13T20:42:00.000Z","Equation":"k = (k_B·T/h)·e^(−ΔG‡/RT)","Field":"Chemical Kinetics","Named After":"Henry Eyring","Symbols":"k rate constant · k_B Boltzmann constant · h Planck constant · ΔG‡ free energy of the transition state, the fleeting halfway arrangement · R gas constant · T temperature","Significance":"Arrhenius's barrier given a physical face: reactions pass through a transition state, and quantum mechanics (there's Planck's h) sets the universal attempt frequency k_BT/h — about six trillion tries per second at room temperature.","Year":1935,"Name":"Eyring Equation"},{"url":"https://app.notion.com/p/Arrhenius-Equation-3bbe52757b5c81509b6bde88bc1b1910","lastEdited":"2026-08-13T20:42:00.000Z","Equation":"k = A·e^(−Eₐ/RT)","Field":"Chemical Kinetics","Named After":"Svante Arrhenius","Symbols":"k rate constant · A pre-exponential factor (how often molecules collide, well-oriented) · Eₐ activation energy, the barrier to react · R gas constant · T absolute temperature","Significance":"Reaction rates climb exponentially with temperature, because only the Boltzmann tail of molecules has energy above the barrier — the rule of thumb that rates double per 10 °C. Cooking, food spoilage, battery aging, and firefly flashes all follow it.","Year":1889,"Name":"Arrhenius Equation"},{"url":"https://app.notion.com/p/Law-of-Mass-Action-3bbe52757b5c81e387bde3fd8345d1e5","lastEdited":"2026-08-13T20:42:00.000Z","Equation":"rate = k·[A]^m·[B]^n","Field":"Chemical Kinetics","Named After":"Cato Guldberg · Peter Waage","Symbols":"[A], [B] concentrations of the reactants · k rate constant · m, n reaction orders (found by experiment, not from the balanced equation)","Significance":"How fast a reaction runs depends on how much of each ingredient is present — the founding statement of chemical kinetics, worked out by two Norwegian brothers-in-law. The exponents hide the reaction's actual mechanism, which is why chemists measure them.","Year":1864,"Name":"Law of Mass Action"},{"url":"https://app.notion.com/p/Griffith-Fracture-Criterion-3bbe52757b5c819eae2bd24ec3193fe8","lastEdited":"2026-08-13T20:40:00.000Z","Equation":"σ_f = √(2Eγ / πa)","Field":"Materials Science","Named After":"Alan Arnold Griffith","Symbols":"σ_f stress at which fracture runs away · E Young's modulus · γ energy to create new surface · a length of the largest existing crack","Significance":"Things break not because their atoms are weak but because flaws concentrate stress — strength falls with the square root of the biggest crack. Why glass fibres are strong while glass panes shatter, why aircraft windows are round, and the founding equation of fracture mechanics.","Year":1921,"Name":"Griffith Fracture Criterion"},{"url":"https://app.notion.com/p/Young-s-Modulus-3bbe52757b5c81f5bb78d159340dd03f","lastEdited":"2026-08-13T20:40:00.000Z","Equation":"E = σ/ε","Field":"Materials Science","Named After":"Thomas Young","Symbols":"σ stress (force per unit area) · ε strain (fractional stretch) · E the stiffness of the material itself, independent of the object's shape","Significance":"Hooke's law made a property of matter rather than of a particular spring — rubber's E is measured in megapascals, steel's in hundreds of gigapascals, diamond's beyond a terapascal. The number engineers reach for first when choosing what to build with.","Year":1807,"Name":"Young's Modulus"},{"url":"https://app.notion.com/p/Hooke-s-Law-3bbe52757b5c81449213c057e1f3e5ab","lastEdited":"2026-08-13T20:40:00.000Z","Equation":"F = −kx","Field":"Materials Science","Named After":"Robert Hooke","Symbols":"F restoring force · k stiffness of the spring or material · x displacement from rest · the minus sign points the force back toward equilibrium","Significance":"Stretch is proportional to force — announced by Hooke as the anagram 'ceiiinosssttuv' (ut tensio, sic vis) to stake his claim before revealing it. Springs, bonds between atoms, and every small vibration in physics answer to it: the harmonic oscillator is this law in motion.","Year":1678,"Name":"Hooke's Law"},{"url":"https://app.notion.com/p/Seismic-Wave-Speeds-3bbe52757b5c81838228de82d104194f","lastEdited":"2026-08-13T20:35:00.000Z","Equation":"v_p = √((K + 4μ/3)/ρ) · v_s = √(μ/ρ)","Field":"Geophysics","Named After":"Siméon Denis Poisson","Symbols":"v_p compressional (P) wave speed · v_s shear (S) wave speed · K bulk modulus (incompressibility) · μ shear modulus (rigidity) · ρ density · liquids have μ = 0, so no S-waves","Significance":"P-waves arrive first and pass through anything; S-waves arrive second and cannot cross liquid — and their shadow on the far side of earthquakes is how we know Earth's outer core is molten. Timing the two arrivals locates quakes and X-rays the planet's interior, layer by layer.","Year":1828,"Name":"Seismic Wave Speeds"},{"url":"https://app.notion.com/p/Elastic-Wave-Equation-3bbe52757b5c818c81f5e08330c436f3","lastEdited":"2026-08-13T20:35:00.000Z","Equation":"ρ·∂²u/∂t² = (λ+μ)∇(∇·u) + μ∇²u","Field":"Geophysics","Named After":"Claude-Louis Navier · Augustin-Louis Cauchy · Siméon Poisson","Symbols":"u displacement of the rock · ρ density · λ, μ the Lamé constants (compressibility and rigidity) · t time · the two terms carry two different wave types","Significance":"Newton's second law written for solid rock — and Poisson noticed the equation splits into two independent waves: compressional and shear. Every seismogram is this equation's solution, rung through the body of the Earth.","Year":1828,"Name":"Elastic Wave Equation"},{"url":"https://app.notion.com/p/Partition-Function-3bbe52757b5c813f974bc000af0892df","lastEdited":"2026-08-13T20:32:00.000Z","Equation":"Z = Σᵢ e^(−Eᵢ/kT)","Field":"Statistical Mechanics","Named After":"Ludwig Boltzmann · Josiah Willard Gibbs","Symbols":"Z the sum over every state i the system can occupy · Eᵢ each state's energy · k Boltzmann constant · T absolute temperature · free energy follows as F = −kT·ln Z","Significance":"One sum that knows everything: energy, entropy, pressure, heat capacity — every thermodynamic quantity is a derivative of ln Z. Statistical mechanics' entire program is 'compute Z, then differentiate', formalized in Gibbs' 1902 treatise.","Year":1902,"Name":"Partition Function"},{"url":"https://app.notion.com/p/Boltzmann-Distribution-3bbe52757b5c816eb97afdbc445f99b7","lastEdited":"2026-08-13T20:32:00.000Z","Equation":"Pᵢ = e^(−Eᵢ/kT) / Z","Field":"Statistical Mechanics","Named After":"Ludwig Boltzmann","Symbols":"Pᵢ probability of finding the system in state i · Eᵢ that state's energy · k Boltzmann constant · T absolute temperature · Z the partition function, normalizing the sum to 1","Significance":"At temperature T, higher-energy states are exponentially rarer — the law behind the thinning atmosphere, the rates of chemical reactions, and why glowing objects shift color with temperature. Arguably the most-used formula in all of physical science.","Year":1868,"Name":"Boltzmann Distribution"},{"url":"https://app.notion.com/p/Equipartition-Theorem-3bbe52757b5c81eab557e046acec2182","lastEdited":"2026-08-13T20:32:00.000Z","Equation":"⟨E⟩ = ½kT per degree of freedom","Field":"Statistical Mechanics","Named After":"James Clerk Maxwell","Symbols":"⟨E⟩ average energy · k Boltzmann constant · T absolute temperature · counts each quadratic way a molecule can hold energy (motion, rotation, vibration)","Significance":"Heat shares itself equally among all the ways a molecule can move — which predicts heat capacities from pure counting. Its mysterious failures at low temperatures were early cracks that quantum theory eventually explained: frozen-out degrees of freedom.","Year":1859,"Name":"Equipartition Theorem"},{"url":"https://app.notion.com/p/Standard-Model-Lagrangian-3bbe52757b5c81258857cffce0164fef","lastEdited":"2026-08-13T20:27:00.000Z","Equation":"ℒ = −¼F_μν·F^μν + iψ̄D̸ψ + ψ̄ᵢyᵢⱼψⱼφ + h.c. + |D_μφ|² − V(φ)","Field":"Particle Physics","Named After":"Sheldon Glashow · Abdus Salam · Steven Weinberg · and many hands","Symbols":"line 1: the force fields (photon, W, Z, gluons) · line 2: matter in motion (quarks, leptons) · line 3: matter meeting the Higgs, gaining mass · line 4: the Higgs field itself · compact notation — expanded it runs to pages","Significance":"Every known particle and every force except gravity, in one (very compressed) expression — the equation on CERN's coffee mugs. Assembled through the 1960s-70s from electroweak unification and quantum chromodynamics; its last missing piece, the Higgs boson, arrived in 2012. Nothing it predicts has yet been caught being wrong.","Year":1975,"Name":"Standard Model Lagrangian"},{"url":"https://app.notion.com/p/Higgs-Potential-3bbe52757b5c8189b87ce1e5b2e563de","lastEdited":"2026-08-13T20:27:00.000Z","Equation":"V(φ) = −μ²|φ|² + λ|φ|⁴","Field":"Particle Physics","Named After":"Peter Higgs · Brout · Englert","Symbols":"φ the Higgs field · μ², λ parameters shaping the potential · the minus sign puts the minimum away from zero — the 'Mexican hat'","Significance":"A field whose lowest-energy state is not zero, so all of space sits in it — and particles wading through acquire mass. Proposed in 1964, confirmed at CERN in 2012 when the field's own ripple, the Higgs boson, finally showed itself.","Year":1964,"Name":"Higgs Potential"},{"url":"https://app.notion.com/p/Dirac-Equation-3bbe52757b5c81ceaa9bfb9384fc46ee","lastEdited":"2026-08-13T20:27:00.000Z","Equation":"(iγ^μ·∂_μ − m)ψ = 0","Field":"Particle Physics","Named After":"Paul Dirac","Symbols":"ψ the electron's four-component field · γ^μ the Dirac matrices · ∂_μ spacetime derivatives · m electron mass · units where ℏ = c = 1","Significance":"Quantum mechanics made compatible with special relativity — and the equation demanded more than it was asked for: electron spin fell out automatically, and its negative-energy solutions predicted antimatter four years before the positron was found.","Year":1928,"Name":"Dirac Equation"},{"url":"https://app.notion.com/p/Chandrasekhar-Limit-3bbe52757b5c81dda75cd703f0a640b3","lastEdited":"2026-08-13T20:25:00.000Z","Equation":"M_Ch ∝ (ℏc/G)^(3/2)/(μₑmₚ)² ≈ 1.4 M☉","Field":"Astrophysics","Named After":"Subrahmanyan Chandrasekhar","Symbols":"M_Ch the maximum white-dwarf mass · ℏ reduced Planck constant · c speed of light · G gravitational constant · μₑ electrons per nucleon · mₚ proton mass · M☉ solar mass","Significance":"Above about 1.4 solar masses, quantum electron pressure can no longer hold a dead star up against its own gravity — collapse continues to a neutron star or black hole. Worked out by Chandrasekhar at 19, aboard the ship carrying him to Cambridge; it's why Type Ia supernovae all detonate at the same mass and make trustworthy cosmic distance markers.","Year":1931,"Name":"Chandrasekhar Limit"},{"url":"https://app.notion.com/p/Schwarzschild-Radius-3bbe52757b5c811abaedc686bb16bbc3","lastEdited":"2026-08-13T20:25:00.000Z","Equation":"r_s = 2GM/c²","Field":"Astrophysics","Named After":"Karl Schwarzschild","Symbols":"r_s the event-horizon radius · G gravitational constant · M mass · c speed of light","Significance":"Squeeze any mass inside this radius and not even light escapes — a black hole. Derived from Einstein's field equations within months of their publication, by an astronomer serving on the Russian front. For the Sun: three kilometres; for Earth: nine millimetres.","Year":1916,"Name":"Schwarzschild Radius"},{"url":"https://app.notion.com/p/Stefan-Boltzmann-Law-3bbe52757b5c8120863ecd94384e0239","lastEdited":"2026-08-13T20:25:00.000Z","Equation":"L = 4πR²σT⁴","Field":"Astrophysics","Named After":"Josef Stefan · Ludwig Boltzmann","Symbols":"L luminosity (power radiated) · R radius of the star · T surface temperature · σ the Stefan–Boltzmann constant","Significance":"A star's brightness from its size and temperature alone — radiated power scales with the fourth power of T, so a modestly hotter star blazes enormously brighter. With a spectrum in hand, this is how astronomers weigh a star's output across light-years.","Year":1879,"Name":"Stefan–Boltzmann Law"},{"url":"https://app.notion.com/p/Half-Life-3bbe52757b5c813ea03edacece1e6c35","lastEdited":"2026-08-13T20:19:00.000Z","Equation":"t½ = ln 2 / λ","Field":"Nuclear Physics","Named After":"Ernest Rutherford","Symbols":"t½ time for half of any sample to decay · λ decay constant · ln 2 ≈ 0.693","Significance":"Every radioactive nuclide has a signature clock: after one half-life, half remains; after ten, a thousandth. Carbon-14's 5,730 years dates archaeology; uranium-238's 4.5 billion years dated the Earth itself.","Year":1904,"Name":"Half-Life"},{"url":"https://app.notion.com/p/Radioactive-Decay-Law-3bbe52757b5c8157a64beb73eeb53735","lastEdited":"2026-08-13T20:19:00.000Z","Equation":"N(t) = N₀·e^(−λt)","Field":"Nuclear Physics","Named After":"Ernest Rutherford · Frederick Soddy","Symbols":"N(t) undecayed nuclei remaining at time t · N₀ the starting number · λ decay constant (each nuclide's characteristic rate) · e base of natural logarithms","Significance":"Each nucleus decays at random, yet a large collection empties on an exact exponential schedule — perfect statistical order out of pure chance. Discovered by Rutherford and Soddy while unravelling what radioactivity actually is: atoms of one element transmuting into another.","Year":1902,"Name":"Radioactive Decay Law"},{"url":"https://app.notion.com/p/Doppler-Effect-3bbe52757b5c814d83e6ee6df24eacca","lastEdited":"2026-08-13T20:15:00.000Z","Equation":"f′ = f·(c + vₒ)/(c − vₛ)","Field":"Acoustics","Named After":"Christian Doppler","Symbols":"f emitted frequency · f′ observed frequency · c wave speed · vₒ observer speed toward the source · vₛ source speed toward the observer","Significance":"Motion squeezes waves ahead and stretches them behind — the siren that drops in pitch as it passes. The same effect, applied to light, is how radar guns catch speeders and how Hubble read the expansion of the universe from galaxy redshifts.","Year":1842,"Name":"Doppler Effect"},{"url":"https://app.notion.com/p/Newton-Laplace-Speed-of-Sound-3bbe52757b5c81799734eea3fa4e014c","lastEdited":"2026-08-13T20:15:00.000Z","Equation":"c = √(γp/ρ)","Field":"Acoustics","Named After":"Isaac Newton · Pierre-Simon Laplace","Symbols":"c speed of sound · p pressure · ρ density · γ adiabatic index (about 1.4 for air) — roughly 343 m/s in room-temperature air","Significance":"How fast pressure waves travel through a gas. Newton derived it first in 1687 and came out 15% slow by assuming compression at constant temperature; Laplace's adiabatic correction — sound compresses air too fast for heat to escape — made theory match experiment.","Year":1816,"Name":"Newton–Laplace Speed of Sound"},{"url":"https://app.notion.com/p/Wave-Equation-3bbe52757b5c81d8b63dd44990bf2054","lastEdited":"2026-08-13T20:15:00.000Z","Equation":"∂²u/∂t² = c²·∇²u","Field":"Acoustics","Named After":"Jean le Rond d'Alembert","Symbols":"u the disturbance (string displacement, air pressure, field strength) · t time · c wave speed · ∇² Laplacian (spatial curvature of the disturbance)","Significance":"One equation for everything that waves: a plucked string, sound in air, ripples on water — and, a century later, Maxwell found light obeying the very same form. Derived by d'Alembert for the vibrating string, it is the mathematical definition of what a wave is.","Year":1746,"Name":"Wave Equation"},{"url":"https://app.notion.com/p/Navier-Stokes-Equations-3bbe52757b5c81978da5de06c7641cc3","lastEdited":"2026-08-13T20:13:00.000Z","Equation":"ρ(∂v/∂t + v·∇v) = −∇p + μ∇²v + f","Field":"Fluid Dynamics","Named After":"Claude-Louis Navier · George Gabriel Stokes","Symbols":"ρ density · v velocity field · p pressure · μ viscosity · f body forces such as gravity · v·∇v the nonlinear term that makes turbulence","Significance":"Newton's second law written for flowing matter — weather, ocean currents, aerodynamics, and blood flow all obey it. Its nonlinear term breeds turbulence, and whether smooth solutions always exist remains a Clay Millennium Problem with a million dollars unclaimed.","Year":1822,"Name":"Navier–Stokes Equations"},{"url":"https://app.notion.com/p/Continuity-Equation-3bbe52757b5c81899f06e3de324e0af4","lastEdited":"2026-08-13T20:13:00.000Z","Equation":"∂ρ/∂t + ∇·(ρv) = 0","Field":"Fluid Dynamics","Named After":"Leonhard Euler","Symbols":"ρ density · v velocity field · t time · ∇· divergence · for incompressible flow it reduces to ∇·v = 0","Significance":"Mass is neither created nor destroyed as fluid flows — what goes in must come out. Why a river races through its narrows and a thumb over a hose makes the jet fly farther.","Year":1757,"Name":"Continuity Equation"},{"url":"https://app.notion.com/p/Bernoulli-s-Equation-3bbe52757b5c819bba4ef3c3031b13f1","lastEdited":"2026-08-13T20:12:00.000Z","Equation":"p + ½ρv² + ρgh = constant","Field":"Fluid Dynamics","Named After":"Daniel Bernoulli","Symbols":"p pressure · ρ density · v flow speed · g gravitational acceleration · h height · holds along a streamline for steady, frictionless, incompressible flow","Significance":"Where a fluid speeds up, its pressure drops — energy bookkeeping along a streamline. Why airplane wings lift, carburetors draw fuel, and a shower curtain billows inward.","Year":1738,"Name":"Bernoulli's Equation"},{"url":"https://app.notion.com/p/Snell-s-Law-3bbe52757b5c813d86cfc29a346fe2f8","lastEdited":"2026-08-13T21:00:00.000Z","Equation":"n₁·sin θ₁ = n₂·sin θ₂","Field":"Waves & Optics","Named After":"Ibn Sahl · Willebrord Snellius","Symbols":"n₁, n₂ refractive indices of the two media · θ₁, θ₂ angles of the ray from the surface normal on each side","Significance":"Light bends when it crosses into a new medium — the rule behind every lens, eyeglass, camera, and the total internal reflection that traps light inside optical fibers. First stated by Ibn Sahl in Baghdad in 984, rediscovered by Snellius in 1621, and it's why pools look shallower than they are.","Year":984,"Name":"Snell's Law"},{"url":"https://app.notion.com/p/Hubble-s-Law-3bbe52757b5c81849e26ff4ad04b3ed8","lastEdited":"2026-08-13T20:08:00.000Z","Equation":"v = H₀·d","Field":"Cosmology","Named After":"Edwin Hubble · Georges Lemaître","Symbols":"v recession velocity of a galaxy · d its distance from us · H₀ the Hubble constant (about 70 km/s per megaparsec today)","Significance":"The farther a galaxy, the faster it recedes — space itself is expanding. Lemaître derived it from general relativity in 1927; Hubble's 1929 measurements made it fact. Run the expansion backwards and you arrive at the Big Bang; H₀ is the first Friedmann equation's ȧ/a measured today — and its exact value is still argued over, a puzzle known as the Hubble tension.","Year":1929,"Name":"Hubble's Law"},{"url":"https://app.notion.com/p/Pythagorean-Theorem-3bbe52757b5c81bfb306fdf6fa438de8","lastEdited":"2026-08-13T20:06:00.000Z","Equation":"a² + b² = c²","Field":"Mathematics","Named After":"Pythagoras","Symbols":"a, b the two legs of a right triangle · c the hypotenuse","Significance":"The square on the hypotenuse equals the sum of the squares on the other two sides — how distance itself is measured, from surveying to GPS to the metric of spacetime. Babylonian tablets list its triples a thousand years before Pythagoras; the Greek contribution was proving it must always hold.","Year":-530,"Name":"Pythagorean Theorem"},{"url":"https://app.notion.com/p/Lorentz-Factor-3bbe52757b5c815f9d30c0e44b4a7608","lastEdited":"2026-08-13T20:58:00.000Z","Equation":"γ = 1/√(1 − v²/c²)","Field":"Special Relativity","Named After":"Hendrik Lorentz","Symbols":"γ the stretch factor · v relative speed · c speed of light · equals 1 at rest, grows without bound as v approaches c","Significance":"The exchange rate of relativity: moving clocks run slow by γ, moving rulers shrink by γ, and kinetic energy diverges as v nears c — which is why nothing with mass reaches light speed. At everyday speeds γ is 1 to a dozen decimal places, which is why none of this is felt.","Year":1904,"Name":"Lorentz Factor"},{"url":"https://app.notion.com/p/Lorentz-Transformations-3bbe52757b5c81e7b649f021e6e295c6","lastEdited":"2026-08-13T20:58:00.000Z","Equation":"x′ = γ(x − vt) · t′ = γ(t − vx/c²)","Field":"Special Relativity","Named After":"Hendrik Lorentz","Symbols":"x, t position and time in one frame · x′, t′ the same event seen from a frame moving at speed v · c speed of light · γ the Lorentz factor · y and z pass through unchanged","Significance":"How space and time coordinates convert between observers in relative motion — and the surprise is that time mixes with position. Written by Lorentz to patch electromagnetism; reinterpreted by Einstein in 1905 as the actual geometry of space and time. Simultaneity has been relative ever since.","Year":1904,"Name":"Lorentz Transformations"},{"url":"https://app.notion.com/p/Third-Law-of-Thermodynamics-3bbe52757b5c812796bdf72be5a740f4","lastEdited":"2026-08-13T20:00:00.000Z","Equation":"S → 0 as T → 0","Field":"Thermodynamics","Named After":"Walther Nernst","Symbols":"S entropy of a perfect crystal · T absolute temperature","Significance":"As temperature approaches absolute zero, entropy approaches a constant floor — zero for a perfect crystal. Consequence: absolute zero itself can be approached but never reached, no matter how clever the refrigerator.","Year":1906,"Name":"Third Law of Thermodynamics"},{"url":"https://app.notion.com/p/Second-Law-of-Thermodynamics-3bbe52757b5c8147a393dbf10b5befde","lastEdited":"2026-08-13T20:00:00.000Z","Equation":"ΔS ≥ 0","Field":"Thermodynamics","Named After":"Sadi Carnot · Rudolf Clausius","Symbols":"ΔS change in total entropy of an isolated system · equality only for reversible processes","Significance":"Disorder never decreases on its own: heat flows hot to cold, engines can't be perfect, and time gets its arrow. Born from Carnot's steam-engine analysis, named by Clausius — arguably the most unbreakable law in physics.","Year":1865,"Name":"Second Law of Thermodynamics"},{"url":"https://app.notion.com/p/First-Law-of-Thermodynamics-3bbe52757b5c819a8209e94b6436d16a","lastEdited":"2026-08-13T20:00:00.000Z","Equation":"ΔU = Q − W","Field":"Thermodynamics","Named After":"Julius Robert von Mayer · James Joule · Rudolf Clausius","Symbols":"ΔU change in internal energy · Q heat added to the system · W work done by the system","Significance":"Energy is never created or destroyed, only moved and converted — heat in, work out, the books always balance. The law that retired the perpetual-motion machine.","Year":1850,"Name":"First Law of Thermodynamics"},{"url":"https://app.notion.com/p/Zeroth-Law-of-Thermodynamics-3bbe52757b5c81538923ca0655445379","lastEdited":"2026-08-13T20:00:00.000Z","Equation":"T₁ = T₃ and T₂ = T₃ ⟹ T₁ = T₂","Field":"Thermodynamics","Named After":"Ralph H. Fowler (naming)","Symbols":"T₁, T₂, T₃ temperatures of three systems · systems in thermal equilibrium share a temperature","Significance":"If two systems each sit in equilibrium with a third, they're in equilibrium with each other — the quiet assumption that makes 'temperature' a well-defined number and thermometers meaningful. So foundational it was named zeroth, after the first and second were taken.","Year":1935,"Name":"Zeroth Law of Thermodynamics"},{"url":"https://app.notion.com/p/Heisenberg-Uncertainty-Principle-3bbe52757b5c8109a4a6c5b903b6e05f","lastEdited":"2026-08-13T19:58:00.000Z","Equation":"Δx·Δp ≥ ℏ/2","Field":"Quantum","Named After":"Werner Heisenberg","Symbols":"Δx uncertainty in position · Δp uncertainty in momentum · ℏ reduced Planck constant","Significance":"Position and momentum cannot both be pinned down — sharpen one and the other blurs. Not a limit of instruments but of nature itself: it keeps electrons from collapsing into nuclei and gives atoms their size.","Year":1927,"Name":"Heisenberg Uncertainty Principle"},{"url":"https://app.notion.com/p/De-Broglie-Wavelength-3bbe52757b5c8170bd5fc796d7589e08","lastEdited":"2026-08-13T19:58:00.000Z","Equation":"λ = h/p","Field":"Quantum","Named After":"Louis de Broglie","Symbols":"λ wavelength associated with a particle · h Planck constant · p momentum","Significance":"If light can act like particles, matter can act like waves — every moving thing has a wavelength. Electrons diffract like light does, which is why electron microscopes see atoms and why atoms have discrete orbitals at all.","Year":1924,"Name":"De Broglie Wavelength"},{"url":"https://app.notion.com/p/Amp-re-Maxwell-Law-3bbe52757b5c817c96ddec4cb629f30c","lastEdited":"2026-08-13T19:56:00.000Z","Equation":"∇×B = μ₀J + μ₀ε₀·∂E/∂t","Field":"Electromagnetism","Named After":"André-Marie Ampère · James Clerk Maxwell","Symbols":"B magnetic field · J current density · E electric field · μ₀ permeability of free space · ε₀ permittivity of free space · t time","Significance":"Currents make magnetic fields — and, Maxwell's crucial addition, so do changing electric fields. That extra term closes the loop: E and B can regenerate each other and race through empty space as light, at exactly c. Fourth of Maxwell's equations, completing the set with Gauss's two laws and Faraday's.","Year":1861,"Name":"Ampère–Maxwell Law"},{"url":"https://app.notion.com/p/Faraday-s-Law-of-Induction-3bbe52757b5c81c9a5d1eaa911ffb7cd","lastEdited":"2026-08-13T19:56:00.000Z","Equation":"∇×E = −∂B/∂t","Field":"Electromagnetism","Named After":"Michael Faraday","Symbols":"E electric field · B magnetic field · ∇× curl (circulation around a point) · t time","Significance":"A changing magnetic field stirs up a circulating electric field — the principle inside every generator, transformer, and induction cooktop. Third of Maxwell's four equations.","Year":1831,"Name":"Faraday's Law of Induction"},{"url":"https://app.notion.com/p/Gauss-s-Law-for-Magnetism-3bbe52757b5c81d18a3cdf143adffbc5","lastEdited":"2026-08-13T19:56:00.000Z","Equation":"∇·B = 0","Field":"Electromagnetism","Named After":"Carl Friedrich Gauss","Symbols":"B magnetic field · ∇· divergence (net outflow from a point)","Significance":"Magnetic field lines never start or end — there are no magnetic monopoles. Cut a magnet in half and you get two magnets, never a lone north pole. Second of Maxwell's four equations.","Year":1835,"Name":"Gauss's Law for Magnetism"},{"url":"https://app.notion.com/p/Kepler-s-Third-Law-3bbe52757b5c81c88eb1cdc2179de58e","lastEdited":"2026-08-13T21:08:00.000Z","Equation":"T² = 4π²a³ / GM","Field":"Celestial Mechanics","Named After":"Johannes Kepler","Symbols":"T orbital period · a semi-major axis of the orbit · G gravitational constant · M mass of the central body","Significance":"Orbital period squared scales with orbit size cubed — the harmony that let Newton reverse-engineer the inverse-square law, and how we weigh stars, planets, and black holes today.","Year":1619,"Name":"Kepler's Third Law"},{"url":"https://app.notion.com/p/Kepler-s-Second-Law-3bbe52757b5c819383a5f551fd37b47c","lastEdited":"2026-08-13T21:08:00.000Z","Equation":"dA/dt = L/2m = constant","Field":"Celestial Mechanics","Named After":"Johannes Kepler","Symbols":"A area swept by the Sun–planet line · t time · L orbital angular momentum · m planet mass","Significance":"The line to the Sun sweeps equal areas in equal times: planets hurry through closest approach and dawdle far away. Conservation of angular momentum, decades before the concept had a name.","Year":1609,"Name":"Kepler's Second Law"},{"url":"https://app.notion.com/p/Kepler-s-First-Law-3bbe52757b5c81dab2e6ed931eca7217","lastEdited":"2026-08-13T21:08:00.000Z","Equation":"r = p / (1 + e·cos θ)","Field":"Celestial Mechanics","Named After":"Johannes Kepler","Symbols":"r distance from the Sun · p semi-latus rectum (size of the orbit) · e eccentricity (0 circle, <1 ellipse) · θ angle from closest approach","Significance":"Planets travel ellipses with the Sun at one focus — not the perfect circles two millennia of astronomy insisted on. Written as the polar equation of the orbit.","Year":1609,"Name":"Kepler's First Law"},{"url":"https://app.notion.com/p/Van-der-Waals-Equation-3bbe52757b5c810c8fb5f469f876c99a","lastEdited":"2026-08-13T19:51:00.000Z","Equation":"(p + a·n²/V²)(V − nb) = nRT","Field":"Chemistry","Named After":"Johannes Diderik van der Waals","Symbols":"p pressure · V volume · n moles · R gas constant · T absolute temperature · a attraction between molecules · b volume the molecules themselves occupy","Significance":"The ideal gas law with reality patched in: molecules attract each other and take up space. Explains why real gases condense into liquids — which pV = nRT never could.","Year":1873,"Name":"Van der Waals Equation"},{"url":"https://app.notion.com/p/Graham-s-Law-of-Effusion-3bbe52757b5c815b8970f54f46005b20","lastEdited":"2026-08-13T19:51:00.000Z","Equation":"r₁/r₂ = √(M₂/M₁)","Field":"Chemistry","Named After":"Thomas Graham","Symbols":"r rate of effusion through a small opening · M molar mass · subscripts: the two gases compared","Significance":"Light molecules escape faster, in inverse proportion to the square root of their mass — why helium balloons deflate overnight, and the principle behind uranium enrichment by diffusion.","Year":1848,"Name":"Graham's Law of Effusion"},{"url":"https://app.notion.com/p/Dalton-s-Law-of-Partial-Pressures-3bbe52757b5c814482d8d6e4bd0f0f2d","lastEdited":"2026-08-13T19:51:00.000Z","Equation":"p = p₁ + p₂ + ⋯","Field":"Chemistry","Named After":"John Dalton","Symbols":"p total pressure of the mixture · p₁, p₂, … partial pressure each gas would exert alone","Significance":"Gases in a mixture ignore each other: each contributes its own pressure independently. How divers compute oxygen dose and how the atmosphere's 21% oxygen is meant.","Year":1801,"Name":"Dalton's Law of Partial Pressures"},{"url":"https://app.notion.com/p/Avogadro-s-Law-3bbe52757b5c819dafd0d0876756a85c","lastEdited":"2026-08-13T19:51:00.000Z","Equation":"V₁/n₁ = V₂/n₂","Field":"Chemistry","Named After":"Amedeo Avogadro","Symbols":"V volume · n amount of gas (moles) · subscripts: two samples · holds at constant temperature and pressure","Significance":"Equal volumes of any gas hold equal numbers of molecules — the insight that made molecular formulas countable and gave the mole its meaning.","Year":1811,"Name":"Avogadro's Law"},{"url":"https://app.notion.com/p/Gay-Lussac-s-Law-3bbe52757b5c812a9168d2a25b3fe20f","lastEdited":"2026-08-13T19:51:00.000Z","Equation":"p₁/T₁ = p₂/T₂","Field":"Chemistry","Named After":"Joseph Louis Gay-Lussac","Symbols":"p pressure · T absolute temperature · subscripts: two states · holds at constant volume and amount","Significance":"In a rigid container, pressure tracks absolute temperature — why a sealed can builds pressure in a fire, and why tire pressure reads higher after the drive.","Year":1802,"Name":"Gay-Lussac's Law"},{"url":"https://app.notion.com/p/Charles-s-Law-3bbe52757b5c81019ffdd15e28719c53","lastEdited":"2026-08-13T19:51:00.000Z","Equation":"V₁/T₁ = V₂/T₂","Field":"Chemistry","Named After":"Jacques Charles","Symbols":"V volume · T absolute temperature · subscripts: two states · holds at constant pressure and amount","Significance":"Warm a gas and it swells in proportion to absolute temperature — hot-air balloons in one line, and an early signpost pointing at absolute zero.","Year":1787,"Name":"Charles's Law"},{"url":"https://app.notion.com/p/Boyle-s-Law-3bbe52757b5c8186884aed5996715fc4","lastEdited":"2026-08-13T19:51:00.000Z","Equation":"p₁V₁ = p₂V₂","Field":"Chemistry","Named After":"Robert Boyle","Symbols":"p pressure · V volume · subscripts: two states of the same gas · holds at constant temperature and amount","Significance":"Squeeze a gas and its pressure rises in exact proportion — the oldest quantitative gas law, and the reason a syringe works.","Year":1662,"Name":"Boyle's Law"},{"url":"https://app.notion.com/p/Second-Friedmann-Equation-3bbe52757b5c81a19543ed416dd7caa2","lastEdited":"2026-08-13T19:48:00.000Z","Equation":"ä/a = −4πG(ρ + 3p/c²)/3 + Λc²/3","Field":"Cosmology","Named After":"Alexander Friedmann","Symbols":"a scale factor of the universe · ȧ, ä its first and second time derivatives · H = ȧ/a Hubble parameter · G gravitational constant · ρ density · p pressure · k spatial curvature (−1, 0, +1) · Λ cosmological constant · c speed of light","Significance":"Whether the expansion speeds up or slows down. Matter and pressure put on the brakes; the cosmological constant steps on the gas — exactly what the 1998 supernova surveys found the universe doing.","Year":1922,"Name":"Second Friedmann Equation"},{"url":"https://app.notion.com/p/First-Friedmann-Equation-3bbe52757b5c818cbf76d40ebcb485e3","lastEdited":"2026-08-13T19:48:00.000Z","Equation":"(ȧ/a)² = 8πGρ/3 − kc²/a² + Λc²/3","Field":"Cosmology","Named After":"Alexander Friedmann","Symbols":"a scale factor of the universe · ȧ, ä its first and second time derivatives · H = ȧ/a Hubble parameter · G gravitational constant · ρ density · p pressure · k spatial curvature (−1, 0, +1) · Λ cosmological constant · c speed of light","Significance":"How fast the universe expands, given what it contains — Einstein's field equations applied to a uniform cosmos. The Hubble parameter, the critical density, and the fate of the universe all fall out of this one line.","Year":1922,"Name":"First Friedmann Equation"},{"url":"https://app.notion.com/p/Euler-s-Identity-3bbe52757b5c81fb9558e243bfa28227","lastEdited":"2026-08-13T19:29:00.000Z","Equation":"e^(iπ) + 1 = 0","Field":"Mathematics","Named After":"Leonhard Euler","Symbols":"e Euler's number · i imaginary unit · π ratio of circumference to diameter","Significance":"Five fundamental constants in one exact statement — routinely voted the most beautiful equation in mathematics.","Year":1748,"Name":"Euler's Identity"},{"url":"https://app.notion.com/p/Gauss-s-Law-3bbe52757b5c81ebb7d4f57536a2a230","lastEdited":"2026-08-13T19:29:00.000Z","Equation":"∇·E = ρ/ε₀","Field":"Electromagnetism","Named After":"Carl Friedrich Gauss","Symbols":"E electric field · ρ charge density · ε₀ permittivity of free space","Significance":"Electric charge is the source of the electric field. One quarter of Maxwell's equations, and the reason field lines start and end on charges.","Year":1835,"Name":"Gauss's Law"},{"url":"https://app.notion.com/p/Planck-Einstein-Relation-3bbe52757b5c8140a1d4f7bff1df0334","lastEdited":"2026-08-13T19:29:00.000Z","Equation":"E = hν","Field":"Quantum","Named After":"Max Planck","Symbols":"E photon energy · h Planck constant · ν frequency of light","Significance":"Light comes in packets whose energy scales with frequency — the crack in classical physics that opened into quantum theory.","Year":1900,"Name":"Planck–Einstein Relation"},{"url":"https://app.notion.com/p/Boltzmann-Entropy-3bbe52757b5c812295c0f19b5930072e","lastEdited":"2026-08-13T19:29:00.000Z","Equation":"S = k·log W","Field":"Thermodynamics","Named After":"Ludwig Boltzmann","Symbols":"S entropy · k Boltzmann constant · W number of microscopic arrangements","Significance":"Entropy counts the ways. The bridge between the microscopic world of atoms and the macroscopic arrow of time — carved on Boltzmann's gravestone.","Year":1877,"Name":"Boltzmann Entropy"},{"url":"https://app.notion.com/p/Ideal-Gas-Law-3bbe52757b5c81a29653e0a84065d7fa","lastEdited":"2026-08-13T19:29:00.000Z","Equation":"pV = nRT","Field":"Thermodynamics","Named After":"Benoît Paul Émile Clapeyron","Symbols":"p pressure · V volume · n amount of gas (moles) · R gas constant · T absolute temperature","Significance":"The behaviour of dilute gases in one line — weather balloons, engine cylinders, and lung volumes to first approximation.","Year":1834,"Name":"Ideal Gas Law"},{"url":"https://app.notion.com/p/Einstein-Field-Equations-3bbe52757b5c81c7b3a7decb4402d1ab","lastEdited":"2026-08-13T20:57:00.000Z","Equation":"G_μν + Λg_μν = (8πG/c⁴)·T_μν","Field":"General Relativity","Named After":"Albert Einstein","Symbols":"G_μν spacetime curvature · Λ cosmological constant · g_μν metric · T_μν energy and momentum content","Significance":"Matter tells spacetime how to curve; curved spacetime tells matter how to move. Black holes, gravitational waves, and the expanding universe live here.","Year":1915,"Name":"Einstein Field Equations"},{"url":"https://app.notion.com/p/Schr-dinger-Equation-3bbe52757b5c811aa60deddf236c3a8c","lastEdited":"2026-08-13T19:29:00.000Z","Equation":"iℏ ∂ψ/∂t = Ĥψ","Field":"Quantum","Named After":"Erwin Schrödinger","Symbols":"ψ wavefunction · ℏ reduced Planck constant · Ĥ Hamiltonian (total energy) operator · i imaginary unit","Significance":"How quantum states evolve in time. Everything from chemistry's periodic trends to semiconductors falls out of solving it.","Year":1926,"Name":"Schrödinger Equation"},{"url":"https://app.notion.com/p/Law-of-Universal-Gravitation-3bbe52757b5c811b8297ce47b2c5d614","lastEdited":"2026-08-13T19:29:00.000Z","Equation":"F = G·m₁m₂ / r²","Field":"Mechanics","Named After":"Isaac Newton","Symbols":"F gravitational force · G gravitational constant · m₁, m₂ the two masses · r distance between them","Significance":"The same rule pulls an apple to the ground and holds the Moon in orbit — the first law to unify heaven and Earth.","Year":1687,"Name":"Law of Universal Gravitation"},{"url":"https://app.notion.com/p/Newton-s-Second-Law-3bbe52757b5c8183bbd5ff733704a984","lastEdited":"2026-08-13T19:29:00.000Z","Equation":"F = ma","Field":"Mechanics","Named After":"Isaac Newton","Symbols":"F net force · m mass · a acceleration","Significance":"The workhorse of classical mechanics: push something, and its motion changes in proportion. Rockets, bridges, and billiards all answer to it.","Year":1687,"Name":"Newton's Second Law"},{"url":"https://app.notion.com/p/Mass-energy-equivalence-3bbe52757b5c819b8730c682ecb3e756","lastEdited":"2026-08-13T20:58:00.000Z","Equation":"E = mc²","Field":"Special Relativity","Named After":"Albert Einstein","Symbols":"E energy · m rest mass · c speed of light in vacuum","Significance":"A little mass is worth an enormous amount of energy — the bookkeeping behind nuclear power, stellar fusion, and particle physics.","Year":1905,"Name":"Mass–energy equivalence"}]</script>
<script>
  const E = JSON.parse(document.getElementById('data').textContent);
  const COLORS = {
    Mechanics: 'var(--c-blue)', Electromagnetism: 'var(--c-violet)', Thermodynamics: 'var(--c-amber)',
    Quantum: 'var(--c-teal)', 'Special Relativity': 'var(--c-red)', Mathematics: 'var(--c-pink)',
    Chemistry: 'var(--c-green)', Cosmology: 'var(--c-bronze)', 'Waves & Optics': 'var(--c-cyan)',
    'Fluid Dynamics': 'var(--c-indigo)', Acoustics: 'var(--c-olive)',
    'Nuclear Physics': 'var(--c-rust)', Astrophysics: 'var(--c-plum)',
    'Particle Physics': 'var(--c-slate)', 'Statistical Mechanics': 'var(--c-wine)',
    Geophysics: 'var(--c-forest)', 'Materials Science': 'var(--c-steel)',
    'Chemical Kinetics': 'var(--c-fuchsia)', 'Information Theory': 'var(--c-lime)',
    Circuits: 'var(--c-yellow)', 'Quantum Field Theory': 'var(--c-aubergine)',
    'General Relativity': 'var(--c-navy)', 'Quantum Computing': 'var(--c-mint)',
    'Celestial Mechanics': 'var(--c-mauve)', 'Plasma Physics': 'var(--c-coral)',
    'Condensed Matter': 'var(--c-periwinkle)', Superconductivity: 'var(--c-ice)',
    Magnetohydrodynamics: 'var(--c-storm)', Thermoelectrics: 'var(--c-ochre)',
    Photonics: 'var(--c-tangerine)', Biophysics: 'var(--c-clay)',
    'Nonlinear Dynamics': 'var(--c-deepsea)',
  };
  E.sort((a, b) => (a.Year ?? 9999) - (b.Year ?? 9999));

  let active = null;
  const fieldsBox = document.getElementById('fields');
  const present = [...new Set(E.map((e) => e.Field).filter(Boolean))];
  const all = document.createElement('button');
  all.className = 'fchip'; all.textContent = 'all'; all.setAttribute('aria-pressed', 'true');
  fieldsBox.appendChild(all);
  all.addEventListener('click', () => { active = null; sync(); });
  for (const f of present) {
    const b = document.createElement('button');
    b.className = 'fchip'; b.textContent = f; b.setAttribute('aria-pressed', 'false');
    b.dataset.field = f;
    b.addEventListener('click', () => { active = active === f ? null : f; sync(); });
    fieldsBox.appendChild(b);
  }
  function sync() {
    for (const b of fieldsBox.children) {
      b.setAttribute('aria-pressed', String(b.dataset.field ? b.dataset.field === active : active === null));
    }
    render();
  }

  const eqs = document.getElementById('eqs');
  function render() {
    eqs.innerHTML = '';
    for (const e of E) {
      if (active && e.Field !== active) continue;
      const c = document.createElement('article');
      c.className = 'kcard eq';
      c.style.setProperty('--fc', COLORS[e.Field] || 'var(--muted)');
      const h = document.createElement('h2');
      const nm = document.createElement('span'); nm.textContent = e.Name || 'Untitled';
      h.appendChild(nm);
      if (e.Field) { const f = document.createElement('span'); f.className = 'fld'; f.textContent = e.Field; h.appendChild(f); }
      const formula = document.createElement('div'); formula.className = 'formula'; formula.textContent = e.Equation || '';
      const sym = document.createElement('div'); sym.className = 'sym'; sym.textContent = e.Symbols || '';
      const sig = document.createElement('p'); sig.className = 'sig'; sig.textContent = e.Significance || '';
      c.append(h, formula, sym, sig);
      const bits = [];
      if (e['Named After']) bits.push(e['Named After']);
      if (e.Year) bits.push(e.Year < 0 ? `c. ${-e.Year} BCE` : String(e.Year));
      if (bits.length) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = bits.join(' · '); c.appendChild(m); }
      eqs.appendChild(c);
    }
  }
  render();
</script>
