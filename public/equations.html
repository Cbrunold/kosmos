<script>
  const E = JSON.parse(document.getElementById('data').textContent);
  const COLORS = {
    Mechanics: 'var(--c-blue)', Electromagnetism: 'var(--c-violet)', Thermodynamics: 'var(--c-amber)',
    Quantum: 'var(--c-teal)', Relativity: 'var(--c-red)', Mathematics: 'var(--c-pink)',
    Chemistry: 'var(--c-green)', Cosmology: 'var(--c-bronze)',
  };
  E.sort((a, b) => (a.Year ?? 9999) - (b.Year ?? 9999));

  let active = null;
  const fieldsBox = document.getElementById('fields');
  const present = [...new Set(E.map((e) => e.Field).filter(Boolean))];
  const all = document.createElement('button');
  all.className = 'fchip'; all.textContent = 'all'; all.setAttribute('aria-pressed', 'true');
  fieldsBox.appendChild(all);
  all.addEventListener('click', () => { active = null; sync(); });
  for (const f of present) {
    const b = document.createElement('button');
    b.className = 'fchip'; b.textContent = f; b.setAttribute('aria-pressed', 'false');
    b.dataset.field = f;
    b.addEventListener('click', () => { active = active === f ? null : f; sync(); });
    fieldsBox.appendChild(b);
  }
  function sync() {
    for (const b of fieldsBox.children) {
      b.setAttribute('aria-pressed', String(b.dataset.field ? b.dataset.field === active : active === null));
    }
    render();
  }

  const eqs = document.getElementById('eqs');
  function render() {
    eqs.innerHTML = '';
    for (const e of E) {
      if (active && e.Field !== active) continue;
      const c = document.createElement('article');
      c.className = 'kcard eq';
      c.style.setProperty('--fc', COLORS[e.Field] || 'var(--muted)');
      const h = document.createElement('h2');
      const nm = document.createElement('span'); nm.textContent = e.Name || 'Untitled';
      h.appendChild(nm);
      if (e.Field) { const f = document.createElement('span'); f.className = 'fld'; f.textContent = e.Field; h.appendChild(f); }
      const formula = document.createElement('div'); formula.className = 'formula'; formula.textContent = e.Equation || '';
      const sym = document.createElement('div'); sym.className = 'sym'; sym.textContent = e.Symbols || '';
      const sig = document.createElement('p'); sig.className = 'sig'; sig.textContent = e.Significance || '';
      c.append(h, formula, sym, sig);
      const bits = [];
      if (e['Named After']) bits.push(e['Named After']);
      if (e.Year) bits.push(String(e.Year));
      if (bits.length) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = bits.join(' · '); c.appendChild(m); }
      eqs.appendChild(c);
    }
  }
  render();
</script>
