<style>

      --cat-nonmetal: #46a850;
      --cat-noble: #8b74e0;
      --cat-lanthanide: #dc5f83;
      --cat-actinide: #a94fd0;
      --st-gas: #9ec5f4;
      --st-liquid: #5598e7;
      --st-solid: #2f6fc4;
      --heat: #5598e7;
      --heat-min: 10;
      --heat-max: 78;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0e1116;
    --panel: #14181d;
    --ink: #e9edf2;
    --ink-2: #aab8c4;
    --muted: #74828e;
    --hairline: #242b33;
    --ring: rgba(233, 237, 242, 0.9);
    --cat-alkali: #e75570;
    --cat-alkearth: #b98800;
    --cat-transition: #4a90e8;
    --cat-posttrans: #0aa085;
    --cat-metalloid: #a4671f;
    --cat-nonmetal: #46a850;
    --cat-noble: #8b74e0;
    --cat-lanthanide: #dc5f83;
    --cat-actinide: #a94fd0;
    --st-gas: #9ec5f4;
    --st-liquid: #5598e7;
    --st-solid: #2f6fc4;
    --heat: #5598e7;
    --heat-min: 10;

  * { box-sizing: border-box; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0;
    padding: 20px clamp(12px, 2.5vw, 32px) 48px;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace; }

  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 20px;
    margin-bottom: 14px;
  }
  .eyebrow {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    width: 100%;
  }
  h1 {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    font-size: clamp(20px, 2.6vw, 28px);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    text-wrap: balance;
  }
  .provenance { font-size: 12.5px; color: var(--ink-2); }
  .provenance a { color: inherit; }
  .searchbox {
    margin-left: auto;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 6px 10px;
    font: 13px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    color: var(--ink);
    width: 210px;
  }
  .searchbox::placeholder { color: var(--muted); }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    margin-bottom: 12px;
  }
  .lenses { display: flex; flex-wrap: wrap; gap: 4px; }
  .lens {
    font: 12px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    letter-spacing: 0.02em;
    color: var(--ink-2);
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .lens:hover { background: var(--panel); }
  .lens[aria-pressed="true"] {
    background: var(--ink);
    color: var(--page);
    border-color: var(--ink);
  }
  .slider-wrap {
    display: none;
    align-items: center;
    gap: 10px;
    font: 12px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    color: var(--ink-2);
  }
  .slider-wrap.on { display: flex; }
  .slider-wrap input[type=range] { width: 200px; accent-color: var(--heat); }
  .slider-val {
    min-width: 76px;
    text-align: right;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 1120px) {
    .layout { grid-template-columns: 1fr; }
    aside.detail { position: static; }
  }

  .tablewrap {
    overflow-x: auto;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 14px;
  }
  .ptable {
    display: grid;
    grid-template-columns: 20px repeat(18, minmax(48px, 1fr));
    gap: 3px;
    min-width: 1000px;
  }
  .glabel, .plabel {
    font: 9px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-variant-numeric: tabular-nums;
  }
  .fgap { height: 10px; }

  .tile {
    position: relative;
    border: 1px solid var(--tile-bd, var(--hairline));
    background: var(--tile-bg, var(--panel));
    border-radius: 4px;
    padding: 3px 4px 4px;
    min-height: 50px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    cursor: pointer;
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    text-align: left;
    transition: opacity 0.15s ease;
  }
  .tile.hollow { border-style: dashed; }
  .tile.ghost { opacity: 0.16; }
  .tile:hover { filter: brightness(1.06); }
  .tile:focus-visible, .lens:focus-visible, .searchbox:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 1px;
  }
  .tile.sel { outline: 2px solid var(--ring); outline-offset: 1px; }
  .tile .z {
    font-size: 8.5px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .tile .sym { font-size: 15px; font-weight: 700; line-height: 1.25; }
  .tile .nm {
    font-size: 7.5px;
    color: var(--ink-2);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.3;
  }
  .marker {
    border: 1px dashed var(--hairline);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 9px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    color: var(--muted);
    min-height: 50px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
    margin-top: 12px;
    font-size: 11.5px;
    color: var(--ink-2);
  }
  .chip { display: inline-flex; align-items: center; gap: 5px; }
  .chip .dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    display: inline-block;
    border: 1px solid transparent;
  }
  .chip .dot.hollowdot { background: transparent !important; border: 1px dashed var(--muted); }
  .gradbar {
    width: 160px;
    height: 10px;
    border-radius: 3px;
    border: 1px solid var(--hairline);
  }
  .legend .mono-val { font-variant-numeric: tabular-nums; color: var(--ink); }

  aside.detail {
    position: sticky;
    top: 16px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 16px;
    font-size: 13px;
  }
  .detail .empty { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .dhead { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .dsym {
    width: 58px;
    height: 58px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    border: 1px solid var(--tile-bd, var(--hairline));
    background: var(--tile-bg, var(--panel));
    flex: none;
  }
  .dsym .s { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .dsym .n { font-size: 9px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .dname { font-size: 17px; font-weight: 650; margin: 0 0 2px; }
  .dcat { font-size: 11.5px; color: var(--ink-2); }
  .props { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0; }
  .props dt {
    color: var(--muted);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    align-self: baseline;
    padding-top: 2px;
  }
  .props dd {
    margin: 0;
    text-align: right;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .props dd .u { color: var(--muted); font-size: 10.5px; }
  .props dd.none { color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; }
  .tag {
    font: 10px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    border: 1px solid var(--hairline);
    color: var(--ink-2);
    border-radius: 99px;
    padding: 2px 8px;
  }
  .derived-note { font-size: 10.5px; color: var(--muted); margin-top: 8px; line-height: 1.45; }
  .deqs-h {
    font: 10px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 12px 0 6px;
  }
  .deqs-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .dext-facts { margin: 4px 0 6px; }
  .dext-text { font-size: 12px; color: var(--ink-2); line-height: 1.55; margin: 4px 0 8px; }
  .dmine {
    font: 10.5px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    border: 1px solid var(--hairline); border-left: 3px solid var(--c-bronze);
    color: var(--ink-2); border-radius: 4px; padding: 2px 7px 2px 6px; text-decoration: none; white-space: nowrap;
  }
  .dmine:hover { color: var(--ink); border-color: var(--ink-2); }
  .dmine.all { border-left-color: var(--muted); color: var(--muted); }
  .deq {
    font: 10.5px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    border: 1px solid var(--hairline);
    border-left: 3px solid var(--cat-alkearth);
    color: var(--ink-2);
    border-radius: 4px;
    padding: 2px 7px 2px 6px;
    text-decoration: none;
  }
  .deq:hover { color: var(--ink); border-color: var(--ink-2); }
  .dmin {
    font: 10.5px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    border: 1px solid var(--hairline);
    border-left: 3px solid var(--cat-posttrans);
    color: var(--ink-2);
    border-radius: 4px;
    padding: 2px 7px 2px 6px;
    text-decoration: none;
  }
  .dmin:hover { color: var(--ink); border-color: var(--ink-2); }
  .dmin.all { border-left-color: var(--heat); color: var(--ink); }
  .dfoot {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--hairline);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .dfoot a { color: var(--ink-2); }

  #tip {
    position: fixed;
    pointer-events: none;
    background: var(--ink);
    color: var(--page);
    border-radius: 6px;
    padding: 7px 10px;
    font: 11.5px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    z-index: 10;
    display: none;
    max-width: 240px;
    line-height: 1.5;
  }
  #tip .t1 { font-weight: 700; }
  #tip .t2 { opacity: 0.75; }

  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
  }

  /* ---------- analyzer ---------- */
  .abtn {
    font: 12px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    background: var(--ink);
    color: var(--page);
    border: 1px solid var(--ink);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .abtn:disabled { opacity: 0.5; cursor: default; }
  .astrip {
    display: none;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    gap: 16px;
  }
  .astrip.on { display: flex; flex-wrap: wrap; }
  .astrip .thumb {
    width: 84px;
    height: 84px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--hairline);
    flex: none;
  }
  .astrip .amain { flex: 1 1 300px; min-width: 260px; }
  .aname {
    font: 700 16px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    margin: 0 0 2px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .aconf {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--hairline);
    border-radius: 99px;
    padding: 2px 8px;
    color: var(--ink-2);
  }
  .asummary { font-size: 13px; color: var(--ink-2); margin: 2px 0 0; line-height: 1.5; }
  .astatus { font: 12px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace; color: var(--ink-2); }
  .astatus.err { color: var(--cat-alkali); }
  .amats { flex: 1 1 240px; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
  .amat .mrow {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--ink-2);
    gap: 8px;
  }
  .amat .mrow .pct { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace; font-variant-numeric: tabular-nums; color: var(--ink); }
  .amat .mbar { height: 5px; border-radius: 3px; background: color-mix(in oklab, var(--heat) 14%, var(--panel)); margin-top: 2px; overflow: hidden; }
  .amat .mbar > div { height: 100%; border-radius: 3px; background: var(--heat); }
  .acaveats { font-size: 10.5px; color: var(--muted); line-height: 1.5; flex-basis: 100%; margin: 4px 0 0; }
  .aclear {
    font: 11px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace;
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--ink-2);
    border-radius: 6px;
    padding: 4px 9px;
    cursor: pointer;
    align-self: flex-start;
  }
  @media (prefers-reduced-motion: no-preference) {
    .astatus.busy::after { content: '…'; animation: adots 1.2s steps(4) infinite; }
    @keyframes adots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  }

  .klang { position: fixed; top: 9px; right: 12px; z-index: 60; display: flex; gap: 0; border: 1px solid var(--hairline); border-radius: 99px; background: color-mix(in oklab, var(--panel) 88%, transparent); backdrop-filter: blur(4px); overflow: hidden; font: 10.5px ui-monospace, "SF Mono", "Cascadia Code", Consolas, Menlo, monospace; letter-spacing: 0.08em; }
  .klang a { color: var(--muted); text-decoration: none; padding: 4px 9px; }
  .klang a.on { color: var(--page); background: var(--ink); }
  .klang a:hover:not(.on) { color: var(--ink); }
  @media print { .klang { display: none; } }
</style>

  const denR = seqRange(E.map((e) => e.density).filter((v) => v != null).map(Math.log10));
  const mpR = seqRange(E.map((e) => e.meltingPt).filter((v) => v != null));
  const bpR = seqRange(E.map((e) => e.boilingPt).filter((v) => v != null));
  const lin = (v, [a, b]) => (v - a) / (b - a);

  // Crustal abundance spans 25 orders of magnitude, and the bottom decades are
  // all decay-chain traces that are "vanishingly rare" alike. Flooring at
  // 10⁻⁶ ppm keeps the precious metals distinguishable instead of crushing
  // gold, silver and copper into one shade at the top of the scale.
  const ABU_FLOOR = 1e-6;
  const abuVals = E.map((e) => e.abundance).filter((v) => v != null);
  const abuR = abuVals.length
    ? [Math.log10(ABU_FLOOR), Math.log10(Math.max(...abuVals))] : [0, 1];
  const abuRank = new Map();   // z -> 1 = rarest, among elements that occur naturally
  E.filter((e) => e.abundance != null).sort((a, b) => a.abundance - b.abundance)
    .forEach((e, i) => abuRank.set(e.z, i + 1));
  const ordinal = (n) => (n % 100 >= 11 && n % 100 <= 13 ? 'th'
    : ({ 1: 'st', 2: 'nd', 3: 'rd' })[n % 10] || 'th');
  const MINESITES = JSON.parse(document.getElementById('minesites').textContent);   // mine page id -> {name,country,type,slug}
  const fmtFactor = (f) => (f >= 100 ? Math.round(f).toLocaleString('en') : f >= 10 ? f.toFixed(0) : f.toFixed(1));
  const fmtPpm = (v) => {
    if (v == null) return null;
    if (v >= 10000) return `${(v / 10000).toFixed(v >= 100000 ? 1 : 2)}%`;
    if (v >= 1) return `${(+v.toPrecision(3)).toLocaleString('en-GB')} ppm`;
    if (v >= 1e-3) return `${+v.toPrecision(2)} ppm`;
    const exp = Math.floor(Math.log10(v));
    const mant = +(v / 10 ** exp).toPrecision(2);
    const sup = String(exp).replace('-', '⁻').replace(/\d/g, (d) => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+d]);
    return `${mant === 1 ? '' : mant + '×'}10${sup} ppm`;
  };
  const yearT = (y) => (y <= 1650 ? ((y + 9000) / 10650) * 0.25 : 0.25 + ((y - 1650) / 360) * 0.75);

  const LENSES = {
    cat: {
      name: 'Category',
      color: (e) => (e.cat ? catColor(e.cat) : null),
      value: (e) => (e.cat ? CAT_DEFS.find((c) => c.key === e.cat).label + (e.catDerived ? ' (derived)' : '') : 'unknown properties'),
      legend: () => [...CAT_DEFS.map((c) => ({ label: c.label, color: catColor(c.key) })), { label: 'unknown properties', hollow: true }],
    },
    state: {
      name: 'State',
      color: (e) => { const s = stateAt(e, temp.valueAsNumber); return s ? `var(--st-${s})` : null; },
      value: (e) => { const s = stateAt(e, temp.valueAsNumber); return s ? `${s} at ${temp.valueAsNumber} °C` : 'melting/boiling point not in Notion'; },
      legend: () => [
        { label: 'gaz', color: 'var(--st-gas)' }, { label: 'liquide', color: 'var(--st-liquid)' },
        { label: 'solide', color: 'var(--st-solid)' }, { label: 'no data', hollow: true }],
      slider: 'temp',
    },
    block: {
      name: 'Block',
      color: (e) => catColor({ s: 'alkali', p: 'nonmetal', d: 'transition', f: 'noble' }[e.block]),
      value: (e) => `bloc ${e.block}`,
      legend: () => ['s', 'p', 'd', 'f'].map((b) => ({ label: `bloc ${b}`, color: catColor({ s: 'alkali', p: 'nonmetal', d: 'transition', f: 'noble' }[b]) })),
    },
    origin: {
      name: 'Origin',
      color: (e) => ({ 'Primordial': catColor('nonmetal'), 'From Decay': catColor('alkearth'), 'Synthetic': catColor('noble') }[e.occurrence] || null),
      value: (e) => e.occurrence || 'not recorded in Notion',
      legend: () => [
        { label: 'primordial', color: catColor('nonmetal') }, { label: 'from decay', color: catColor('alkearth') },
        { label: 'synthétique', color: catColor('noble') }, { label: 'not recorded', hollow: true }],
    },
    mass: { name: 'Mass', seq: true, t: (e) => (e.atomicMass == null ? null : lin(e.atomicMass, massR)),
      value: (e) => fmtNum(e.atomicMass, 'u') || 'no data', range: () => [`${massR[0]} u`, `${massR[1]} u`] },
    density: { name: 'Density', seq: true, t: (e) => (e.density == null ? null : lin(Math.log10(e.density), denR)),
      value: (e) => fmtNum(e.density, 'g/cm³') || 'no data', range: () => ['9×10⁻⁵', '22.6 g/cm³ (log scale)'] },
    melt: { name: 'Melting', seq: true, t: (e) => (e.meltingPt == null ? null : lin(e.meltingPt, mpR)),
      value: (e) => fmtNum(e.meltingPt, '°C') || 'no data', range: () => [`${mpR[0]} °C`, `${mpR[1]} °C`] },
    boil: { name: 'Boiling', seq: true, t: (e) => (e.boilingPt == null ? null : lin(e.boilingPt, bpR)),
      value: (e) => fmtNum(e.boilingPt, '°C') || 'no data', range: () => [`${bpR[0]} °C`, `${bpR[1]} °C`] },
    disc: { name: 'Discovery', seq: true, t: (e) => yearT(e.discovered),
      value: (e) => `découvert ${fmtYear(e.discovered)}`, range: () => ['9000 BCE', '2009'], slider: 'year' },
  };
  // Rarity, not abundance: the scale runs hot for the scarce ones, which is the
  // question people actually ask of a periodic table. Only offered if the data
  // is there — it arrives from Notion via scripts/seed_abundance.py.
  // Concentration factor: ore grade over crustal abundance — how much geology has to
  // enrich an element before mining it pays. Log scale from 1× to 10⁵×; hot = hard.
  const conc = (e) => (e.oreGrade != null && e.abundance ? e.oreGrade / e.abundance : null);
  if (E.some((e) => conc(e) != null)) {
    const CF_LO = 0, CF_HI = 5;   // log10
    LENSES.conc = {
      name: 'Concentration', seq: true,
      t: (e) => { const f = conc(e); return f == null ? null : Math.max(0, Math.min(1, (Math.log10(f) - CF_LO) / (CF_HI - CF_LO))); },
      value: (e) => { const f = conc(e); return f == null ? (e.minedAs === 'By-product' ? 'by-product — no ore of its own' : e.minedAs === 'Not mined' ? 'not mined' : 'no ore grade recorded') : `le minerai est ${fmtFactor(f)}× plus riche que la croûte`; },
      range: () => ['1× (crust)', '≥10⁵× (log)'],
    };
  }
  if (E.some((e) => e.abundance != null)) {
    LENSES.rarity = {
      name: 'Rarity', seq: true,
      t: (e) => (e.abundance == null ? null : 1 - lin(Math.log10(Math.max(e.abundance, ABU_FLOOR)), abuR)),
      value: (e) => (e.abundance == null ? 'does not occur naturally' : `${fmtPpm(e.abundance)} of the crust${abuRank.get(e.z) ? ` · ${abuRank.get(e.z)}${ordinal(abuRank.get(e.z))} rarest of ${abuRank.size}` : ''}`),
      range: () => ['46% by mass', '≤10⁻⁶ ppm (log)'],
    };
  }
  for (const k of Object.keys(LENSES)) {
    const L = LENSES[k];
    if (L.seq) { L.color = (e) => { const t = L.t(e); return t == null ? null : heat(t); }; L.solid = true; }
  }

  // ---------- build grid ----------
  const ptable = document.getElementById('ptable');
  const frag = document.createDocumentFragment();
  const cell = (cls, txt, r, c) => {
    const d = document.createElement('div');
    d.className = cls; d.textContent = txt;
    d.style.gridRow = r; d.style.gridColumn = c;
    frag.appendChild(d); return d;
  };
  for (let g = 1; g <= 18; g++) cell('glabel', g, 1, g + 1);
  for (let p = 1; p <= 7; p++) cell('plabel', p, p + 1, 1);
  cell('marker', '57–71', 7, 4).title = 'Lanthanides — lignes ci-dessous';
  cell('marker', '89–103', 8, 4).title = 'Actinides — lignes ci-dessous';
  cell('fgap', '', 9, '1 / -1');

  const tiles = {};
  for (const e of E) {
    const b = document.createElement('button');
    b.className = 'tile';
    b.style.gridRow = e.row;
    b.style.gridColumn = e.col + 1;
    b.innerHTML = `<span class="z">${e.z}</span><span class="sym"></span><span class="nm"></span>`;
    b.querySelector('.sym').textContent = e.sym;
    b.querySelector('.nm').textContent = e.name;
    b.addEventListener('click', () => select(e.z));
    b.addEventListener('mousemove', (ev) => tipShow(e, ev));
    b.addEventListener('mouseleave', tipHide);
    tiles[e.z] = b;
    frag.appendChild(b);
  }
  ptable.appendChild(frag);

  // ---------- painting ----------
  let lens = 'cat';
  const temp = document.getElementById('temp');
  const year = document.getElementById('year');
  const q = document.getElementById('q');

  function paint() {
    const L = LENSES[lens];
    const query = q.value.trim().toLowerCase();
    for (const e of E) {
      const el = tiles[e.z];
      const color = L.color(e);
      if (color == null) {
        el.style.setProperty('--tile-bg', 'var(--panel)');
        el.style.setProperty('--tile-bd', 'var(--hairline)');
        el.classList.add('hollow');
      } else {
        el.classList.remove('hollow');
        if (L.solid) {
          el.style.setProperty('--tile-bg', color);
          el.style.setProperty('--tile-bd', 'color-mix(in oklab, var(--heat) 55%, var(--hairline))');
        } else {
          el.style.setProperty('--tile-bg', `color-mix(in oklab, ${color} 30%, var(--panel))`);
          el.style.setProperty('--tile-bd', `color-mix(in oklab, ${color} 60%, var(--panel))`);
        }
      }
      let ghost = false;
      if (query) ghost = !(e.name.toLowerCase().includes(query) || e.sym.toLowerCase() === query || String(e.z) === query);
      if (lens === 'disc' && e.discovered > year.valueAsNumber) ghost = true;
      el.classList.toggle('ghost', ghost);
    }
    paintLegend();
  }

  function paintLegend() {
    const L = LENSES[lens];
    const lg = document.getElementById('legend');
    lg.innerHTML = '';
    if (L.seq) {
      const [lo, hi] = L.range();
      const bar = document.createElement('div');
      bar.className = 'gradbar';
      bar.style.background = `linear-gradient(90deg, ${heat(0)}, ${heat(0.5)}, ${heat(1)})`;
      const mk = (t) => { const s = document.createElement('span'); s.className = 'mono-val mono'; s.textContent = t; return s; };
      lg.append(mk(lo), bar, mk(hi));
      const n = E.filter((e) => L.t(e) == null).length;
      if (n) { const s = document.createElement('span'); s.innerHTML = `<span class="chip"><span class="dot hollowdot"></span>aucune donnée (${n})</span>`; lg.append(s); }
      if (lens === 'disc') { const s = document.createElement('span'); s.textContent = 'faites glisser l\'année pour remonter le temps'; lg.append(s); }
    } else {
      for (const item of L.legend()) {
        const c = document.createElement('span');
        c.className = 'chip';
        const dot = document.createElement('span');
        dot.className = 'dot' + (item.hollow ? ' hollowdot' : '');
        if (!item.hollow) dot.style.background = `color-mix(in oklab, ${item.color} 30%, var(--panel))`;
        if (!item.hollow) dot.style.borderColor = `color-mix(in oklab, ${item.color} 60%, var(--panel))`;
        c.append(dot, document.createTextNode(item.label));
        lg.appendChild(c);
      }
    }
  }

  // ---------- lens switcher ----------
  const lensesBox = document.getElementById('lenses');
  for (const [k, L] of Object.entries(LENSES)) {
    const b = document.createElement('button');
    b.className = 'lens';
    b.textContent = L.name;
    b.setAttribute('aria-pressed', String(k === lens));
    b.addEventListener('click', () => {
      lens = k;
      for (const x of lensesBox.children) x.setAttribute('aria-pressed', 'false');
      b.setAttribute('aria-pressed', 'true');
      document.getElementById('tempwrap').classList.toggle('on', L.slider === 'temp');
      document.getElementById('yearwrap').classList.toggle('on', L.slider === 'year');
      paint();
      if (sel) renderDetail(byZ[sel]);
    });
    lensesBox.appendChild(b);
  }

  temp.addEventListener('input', () => { document.getElementById('tempval').textContent = `${temp.valueAsNumber} °C`; paint(); if (sel) renderDetail(byZ[sel]); });
  year.addEventListener('input', () => { document.getElementById('yearval').textContent = fmtYear(year.valueAsNumber); paint(); });
  q.addEventListener('input', () => paint());
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => paint());

  // ---------- tooltip ----------
  const tip = document.getElementById('tip');
  function tipShow(e, ev) {
    const L = LENSES[lens];
    tip.innerHTML = `<div class="t1"></div><div class="t2"></div>`;
    tip.children[0].textContent = `${e.sym} · ${e.name} · ${e.z}`;
    tip.children[1].textContent = L.value(e);
    tip.style.display = 'block';
    const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8);
    const y = Math.min(ev.clientY + 16, innerHeight - tip.offsetHeight - 8);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  function tipHide() { tip.style.display = 'none'; }

  // ---------- detail panel ----------
  let sel = null;
  function select(z) {
    if (sel) tiles[sel].classList.remove('sel');
    sel = z;
    tiles[z].classList.add('sel');
    renderDetail(byZ[z]);
  }
  addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && sel) {
      tiles[sel].classList.remove('sel');
      sel = null;
      document.getElementById('detail').innerHTML = '<p class="empty">Choisissez un élément pour l\'examiner.</p>';
    }
  });

  function renderDetail(e) {
    const d = document.getElementById('detail');
    const catLabel = e.cat ? CAT_DEFS.find((c) => c.key === e.cat).label : 'propriétés chimiques inconnues';
    const color = e.cat ? catColor(e.cat) : null;
    const rows = [
      ['atomic mass', fmtNum(e.atomicMass, 'u')],
      ['group', e.groupNum ?? (e.z >= 89 && e.z <= 103 ? 'f-block · actinide' : 'f-block · lanthanide')],
      ['period', e.periodNum],
      ['block', e.block + '-block'],
      ['state 0 °C', e.state0C],
      ['state 20 °C', e.state20C === 'Unknown' ? null : e.state20C],
      ['melting pt', fmtNum(e.meltingPt, '°C')],
      ['boiling pt', fmtNum(e.boilingPt, '°C')],
      ['density', fmtNum(e.density, 'g/cm³')],
      ['origin', e.occurrence],
      ['discovered', fmtYear(e.discovered)],
      ['in the crust', e.abundance == null
        ? (e.occurrence === 'Synthetic' ? 'none — synthetic only' : null)
        : `${fmtPpm(e.abundance)} · ${abuRank.get(e.z)}${ordinal(abuRank.get(e.z))} plus rare sur ${abuRank.size}`],
    ];
    const dl = rows.map(([k, v]) =>
      `<dt>${k}</dt><dd class="${v == null ? 'none' : ''}">${v == null ? '— not in Notion' : v}</dd>`).join('');
    const tags = [...e.families, ...(e.unknownProps ? ['#Unknown Chemical Properties'] : [])]
      .map((t) => `<span class="tag"></span>`);
    d.innerHTML = `
      <div class="dhead">
        <div class="dsym" style="${color ? `--tile-bg: color-mix(in oklab, ${color} 30%, var(--panel)); --tile-bd: color-mix(in oklab, ${color} 60%, var(--panel));` : ''}">
          <span class="s"></span><span class="n"></span>
        </div>
        <div>
          <p class="dname"></p>
          <div class="dcat"></div>
        </div>
      </div>
      <dl class="props">${dl}</dl>
      <div class="tags"></div>
      <div class="derived-note"></div>
      <div class="dmins"></div>
      <div class="dext"></div>
      <div class="deqs"></div>
      <div class="dfoot">
        <a href="${e.pageUrl}" target="_blank" rel="noopener">open in Notion ↗</a>
        <span>edited ${new Date(e.lastEdited).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
      </div>`;
    d.querySelector('.dsym .s').textContent = e.sym;
    d.querySelector('.dsym .n').textContent = e.z;
    d.querySelector('.dname').textContent = e.name;
    d.querySelector('.dcat').textContent = catLabel + (e.catDerived ? ' · derived from group 1' : '');
    const tagbox = d.querySelector('.tags');
    for (const t of [...e.families, ...(e.unknownProps ? ['#Unknown Chemical Properties'] : [])]) {
      const s = document.createElement('span'); s.className = 'tag'; s.textContent = t.replace(/^#/, ''); tagbox.appendChild(s);
    }
    const notes = [];
    if (e.catDerived) notes.push('“Alkali metal” is derived from group 1 — the Notion row is tagged only #Metal.');
    if (rows.some(([, v]) => v == null)) notes.push('Dashes are genuine gaps in the Notion database, not zeros.');
    d.querySelector('.derived-note').textContent = notes.join(' ');

    // minerals that contain this element (decoded from the Minerals database)
    const mi = MIN[e.sym];
    if (mi) {
      const box = d.querySelector('.dmins');
      const h2 = document.createElement('div');
      h2.className = 'deqs-h';
      h2.textContent = `minéraux · ${mi.n.toLocaleString('en')}`;
      box.appendChild(h2);
      const list = document.createElement('div');
      list.className = 'deqs-list';
      for (const nm of mi.examples) {
        const a = document.createElement('a');
        a.className = 'dmin';
        a.href = '/fr/minerals#' + encodeURIComponent(nm.toLowerCase());
        a.textContent = nm;
        list.appendChild(a);
      }
      const all = document.createElement('a');
      all.className = 'dmin all';
      all.href = '/fr/minerals?el=' + e.sym;
      all.textContent = mi.n > mi.examples.length ? `tous les ${mi.n.toLocaleString('en')} →` : 'browse →';
      all.title = `Filtrer la collection de minéraux sur les minéraux contenant ${e.name}`;
      list.appendChild(all);
      box.appendChild(list);
    }

    // sources & extraction (scripts/seed_mining.py): where it comes from and how it is won
    if (e.minedAs || e.extraction || e.oreGrade != null) {
      const box = d.querySelector('.dext');
      const h = document.createElement('div');
      h.className = 'deqs-h';
      h.textContent = 'sources & extraction' + (e.minedAs ? ` · ${e.minedAs.toLowerCase()}` : '');
      box.appendChild(h);
      const facts = [];
      if (e.oreMinerals) facts.push(['ore minerals', e.oreMinerals]);
      if (e.oreGrade != null) {
        facts.push(['typical ore grade', fmtPpm(e.oreGrade)]);
        if (e.abundance) {
          const f = e.oreGrade / e.abundance;
          facts.push(['concentration factor', `${fmtFactor(f)}× la croûte — ` +
            (f < 10 ? 'barely enriched; mined by the billion tonnes' :
             f < 100 ? 'modestly enriched ore bodies' :
             f < 1000 ? 'needs a real ore deposit' :
             f < 10000 ? 'only where geology has concentrated it hard' :
             'freakish enrichment — a handful of deposits on Earth')]);
        }
      }
      if (facts.length) {
        const dl = document.createElement('dl');
        dl.className = 'props dext-facts';
        for (const [k, v] of facts) {
          const dt = document.createElement('dt'); dt.textContent = k;
          const dd = document.createElement('dd'); dd.textContent = v;
          dl.append(dt, dd);
        }
        box.appendChild(dl);
      }
      if (e.extraction) {
        const p = document.createElement('p');
        p.className = 'dext-text';
        p.textContent = e.extraction;
        box.appendChild(p);
      }
      const sites = (e.mines || []).map((id) => MINESITES[id]).filter(Boolean)
        .sort((a, b) => a.name.localeCompare(b.name));
      if (sites.length) {
        const list = document.createElement('div');
        list.className = 'deqs-list';
        for (const m of sites) {
          const a = document.createElement('a');
          a.className = 'dmine';
          a.href = '/fr/mines#' + m.slug;
          a.textContent = m.name;
          a.title = `${m.country} · ${vocab(m.type)}`;
          list.appendChild(a);
        }
        const all = document.createElement('a');
        all.className = 'dmine all';
        all.href = '/fr/mines?el=' + e.sym;
        all.textContent = 'sur la carte →';
        list.appendChild(all);
        box.appendChild(list);
      }
    }

    // equations that concern this element (Notion relation, mirrored from the Equations DB)
    const eqs = (e.equations || []).map((id) => EQ[id]).filter(Boolean)
      .sort((a, b) => a.name.localeCompare(b.name));
    if (eqs.length) {
      const box = d.querySelector('.deqs');
      const h = document.createElement('div');
      h.className = 'deqs-h';
      h.textContent = `équations · ${eqs.length}`;
      box.appendChild(h);
      const list = document.createElement('div');
      list.className = 'deqs-list';
      for (const q of eqs) {
        const a = document.createElement('a');
        a.className = 'deq';
        a.href = '/fr/equations#' + q.slug;
        a.title = vocab(q.field) || '';
        a.textContent = q.name;
        list.appendChild(a);
      }
      box.appendChild(list);
    }
  }

  // deep links: /elements#fe opens iron
  function openHash() {
    const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    if (!h) return;
    const hit = E.find((e) => e.sym.toLowerCase() === h || String(e.z) === h);
    if (hit) { select(hit.z); tiles[hit.z].scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  }
  addEventListener('hashchange', openHash);

  // ---------- provenance ----------
  const lastEdit = new Date(Math.max(...E.map((e) => Date.parse(e.lastEdited))));
  const gaps = E.filter((e) => e.meltingPt == null || e.boilingPt == null || e.density == null || e.occurrence == null).length;
  document.getElementById('prov').textContent =
    `${E.length} éléments · dernière modification Notion ${lastEdit.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })} · ${gaps} éléments présentent des lacunes`;

  document.getElementById('tempval').textContent = '20 °C';
  paint();
  openHash();

  // ---------- analyzer: photo -> elemental breakdown ----------
  const symToZ = Object.fromEntries(E.map((e) => [e.sym, e.z]));
  let analysisMap = null; // z -> massPercent
  let analysisLensBtn = null;
  const astrip = document.getElementById('astrip');
  const astatus = document.getElementById('astatus');

  const abtn = document.createElement('button');
  abtn.className = 'abtn';
  abtn.textContent = '⚛ analyser un objet';
  abtn.title = 'Photographiez ou téléversez un objet — Claude le décompose en éléments';
  const afile = document.createElement('input');
  afile.type = 'file';
  afile.accept = 'image/*';
  afile.style.display = 'none';
  document.querySelector('header.top').append(abtn, afile);
  abtn.addEventListener('click', () => afile.click());
  afile.addEventListener('change', () => { if (afile.files[0]) runAnalysis(afile.files[0]); afile.value = ''; });

  function setStatus(msg, cls) {
    astatus.textContent = msg || '';
    astatus.className = 'astatus' + (cls ? ' ' + cls : '');
  }

  async function downscale(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, bad) => {
        const i = new Image();
        i.onload = () => ok(i);
        i.onerror = () => bad(new Error('Could not read that image.'));
        i.src = url;
      });
      const scale = Math.min(1, 1568 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', 0.85);
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  async function runAnalysis(file) {
    astrip.classList.add('on');
    document.getElementById('aobject').textContent = '';
    document.getElementById('aconf').textContent = '';
    document.getElementById('asummary').textContent = '';
    document.getElementById('amats').innerHTML = '';
    document.getElementById('acaveats').textContent = '';
    abtn.disabled = true;
    try {
      const dataUrl = await downscale(file);
      document.getElementById('athumb').src = dataUrl;
      setStatus('Claude is looking at your photo', 'busy');
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl.split(',')[1], mediaType: 'image/jpeg' }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Échec de l'analyse (${res.status}).`);
      renderAnalysis(data);
    } catch (e) {
      setStatus(e.message, 'err');
    } finally {
      abtn.disabled = false;
    }
  }

  function renderAnalysis(a) {
    setStatus('');
    document.getElementById('aobject').textContent = a.object || 'Unknown object';
    document.getElementById('aconf').textContent = (a.confidence || '?') + ' confidence';
    document.getElementById('asummary').textContent = a.summary || '';
    document.getElementById('acaveats').textContent = a.caveats || '';

    const mats = document.getElementById('amats');
    mats.innerHTML = '';
    for (const m of (a.materials || []).slice(0, 6)) {
      const d = document.createElement('div');
      d.className = 'amat';
      const row = document.createElement('div');
      row.className = 'mrow';
      const nm = document.createElement('span');
      nm.textContent = m.name + (m.note ? ` — ${m.note}` : '');
      const pct = document.createElement('span');
      pct.className = 'pct';
      pct.textContent = `${Math.round(m.sharePercent)}%`;
      row.append(nm, pct);
      const bar = document.createElement('div');
      bar.className = 'mbar';
      const fill = document.createElement('div');
      fill.style.width = Math.min(100, Math.max(2, m.sharePercent)) + '%';
      bar.appendChild(fill);
      d.append(row, bar);
      mats.appendChild(d);
    }

    analysisMap = {};
    for (const el of a.elements || []) {
      const z = symToZ[el.symbol];
      if (z && el.massPercent > 0) analysisMap[z] = { pct: el.massPercent, source: el.source, name: el.name };
    }
    if (Object.keys(analysisMap).length === 0) {
      setStatus('No elements identified in this photo.', '');
      return;
    }
    registerAnalysisLens();
    analysisLensBtn.click();
  }

  function registerAnalysisLens() {
    const pcts = Object.values(analysisMap).map((v) => Math.max(0.01, v.pct));
    const lo = Math.log10(Math.min(...pcts));
    const hi = Math.log10(Math.max(...pcts));
    LENSES.analysis = {
      name: 'Analysis',
      seq: true,
      solid: true,
      t: (e) => {
        const m = analysisMap[e.z];
        if (!m) return null;
        return hi === lo ? 1 : (Math.log10(Math.max(0.01, m.pct)) - lo) / (hi - lo);
      },
      color: (e) => {
        const t = LENSES.analysis.t(e);
        return t == null ? null : heat(t);
      },
      value: (e) => {
        const m = analysisMap[e.z];
        return m ? `${+m.pct.toPrecision(3)}% de la masse · ${m.source}` : 'not present in this object';
      },
      range: () => [`${+Math.min(...pcts).toPrecision(2)}%`, `${+Math.max(...pcts).toPrecision(2)}% de la masse (échelle log)`],
    };
    if (!analysisLensBtn) {
      analysisLensBtn = document.createElement('button');
      analysisLensBtn.className = 'lens';
      analysisLensBtn.textContent = 'Analyse';
      analysisLensBtn.setAttribute('aria-pressed', 'false');
      analysisLensBtn.addEventListener('click', () => {
        lens = 'analysis';
        for (const x of lensesBox.children) x.setAttribute('aria-pressed', 'false');
        analysisLensBtn.setAttribute('aria-pressed', 'true');
        document.getElementById('tempwrap').classList.remove('on');
        document.getElementById('yearwrap').classList.remove('on');
        paint();
      });
      lensesBox.appendChild(analysisLensBtn);
    }
  }

  // ghost elements absent from the analysis when the Analysis lens is active
  const basePaint = paint;
  paint = function () {
    basePaint();
    if (lens === 'analysis' && analysisMap) {
      for (const e of E) if (!analysisMap[e.z]) tiles[e.z].classList.add('ghost');
    }
  };

  document.getElementById('aclear').addEventListener('click', () => {
    astrip.classList.remove('on');
    analysisMap = null;
    delete LENSES.analysis;
    if (analysisLensBtn) { analysisLensBtn.remove(); analysisLensBtn = null; }
    lens = 'cat';
    lensesBox.children[0].click();
  });
</script>
